/* ---------------------------------------------------------------------
   SHADERS
   --------------------------------------------------------------------- */
const COMMON = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uFrameH; uniform float uTime; uniform vec4 uCam;
uniform float uFocus; uniform float uAper; uniform vec4 uP0; uniform vec4 uP1;
out vec4 fragColor;
vec2 gUV;
#define T uTime
const float PI=3.14159265;
float sat(float x){return clamp(x,0.,1.);}
float hash11(float p){p=fract(p*.1031);p*=p+33.33;p*=p+p;return fract(p);}
float hash21(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
vec2 hash22(vec2 p){vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973));p3+=dot(p3,p3.yzx+33.33);return fract((p3.xx+p3.yz)*p3.zy);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);
 return mix(mix(hash21(i),hash21(i+vec2(1,0)),u.x),mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),u.x),u.y);}
const mat2 FM=mat2(1.6,1.2,-1.2,1.6);
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*noise(p);p=FM*p+3.1;a*=.5;}return s;}
float fbm3(vec2 p){float s=0.,a=.5;for(int i=0;i<3;i++){s+=a*noise(p);p=FM*p+3.1;a*=.5;}return s*1.14;}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,s,-s,c);}
float win(float t,float a,float b,float fi,float fo){return smoothstep(a,a+fi,t)*(1.-smoothstep(b-fo,b,t));}
float ease(float x){x=sat(x);return x*x*(3.-2.*x);}
float sdCircle(vec2 p,float r){return length(p)-r;}
float sdBox(vec2 p,vec2 b){vec2 d=abs(p)-b;return length(max(d,0.))+min(max(d.x,d.y),0.);}
float sdSeg(vec2 p,vec2 a,vec2 b){vec2 pa=p-a,ba=b-a;float h=sat(dot(pa,ba)/dot(ba,ba));return length(pa-ba*h);}
float sdUCap(vec2 p,vec2 pa,vec2 pb,float ra,float rb){
 p-=pa;pb-=pa;float h=dot(pb,pb);
 vec2 q=vec2(dot(p,vec2(pb.y,-pb.x)),dot(p,pb))/h;
 q.x=abs(q.x);float b=ra-rb;vec2 c=vec2(sqrt(max(h-b*b,1e-6)),b);
 float k=c.x*q.y-c.y*q.x;float m=dot(c,q);float n=dot(q,q);
 if(k<0.)return sqrt(h*n)-ra;else if(k>c.x)return sqrt(h*(n+1.-2.*q.y))-rb;return m-ra;}
float sdTrap(vec2 p,float r1,float r2,float he){
 vec2 k1=vec2(r2,he);vec2 k2=vec2(r2-r1,2.*he);p.x=abs(p.x);
 vec2 ca=vec2(p.x-min(p.x,(p.y<0.)?r1:r2),abs(p.y)-he);
 vec2 cb=p-k1+k2*sat(dot(k1-p,k2)/dot(k2,k2));
 float s=(cb.x<0.&&ca.y<0.)?-1.:1.;return s*sqrt(min(dot(ca,ca),dot(cb,cb)));}
float sdEll(vec2 p,vec2 r){float k0=length(p/r);float k1=length(p/(r*r));return k0*(k0-1.)/max(k1,1e-5);}
float smin(float a,float b,float k){float h=sat(.5+.5*(b-a)/k);return mix(b,a,h)-k*h*(1.-h);}
vec2 LP(float z){return uCam.xy+rot(uCam.w)*gUV*(uCam.z+z);}
float PX(float z){return (uCam.z+z)/uFrameH;}
float BW(float z){return PX(z)*1.3+uAper*abs(z-uFocus)*uCam.z/(uCam.z+uFocus);}
float cov(float d,float w){return 1.-smoothstep(-w,w,d);}
vec3 fogz(vec3 c,float z,vec3 fc,float k){return mix(c,fc,1.-exp(-max(z,0.)*k));}
float G(float y,float c,float w){float u=(y-c)/w;return exp(-u*u);}

/* ---------- architecture & nature ---------- */
float sdHall(vec2 p,float w,float h){
 float d=sdBox(p-vec2(0.,h*0.3),vec2(w*0.78,h*0.3));
 float x=abs(p.x)/w;
 float eave=h*0.58+h*0.14*pow(x,5.);
 float top=h*1.0-h*0.34*pow(x,1.4);
 float roof=max(max(eave-p.y,p.y-top),abs(p.x)-w*1.02);
 d=min(d,roof);
 d=min(d,sdBox(p-vec2(0.,h*1.02),vec2(w*0.52,h*0.035)));
 d=min(d,sdCircle(vec2(abs(p.x),p.y)-vec2(w*0.54,h*1.08),h*0.045));
 return d;}
float sdPine(vec2 p,float h,float seed){
 float d=sdUCap(p,vec2(0.),vec2(0.12*sin(seed),h*0.9),0.06*h*0.5,0.015*h);
 for(int i=0;i<4;i++){float fi=float(i);
  vec2 c=vec2((hash11(seed+fi*1.7)-0.5)*h*0.55,h*(0.42+fi*0.15));
  d=min(d,sdEll(p-c,vec2(h*(0.3-fi*0.05),h*0.06))+(noise(p*7./h+seed+fi)-0.5)*0.09*h);}
 return d;}
float sdTreeBlob(vec2 p,float h,float seed){
 float d=sdUCap(p,vec2(0.,-1.),vec2(0.05*sin(seed),h*0.6),0.05*h,0.03*h);
 float c=sdEll(p-vec2(0.,h*0.72),vec2(h*0.34,h*0.3));
 c=min(c,sdEll(p-vec2(h*0.2*(hash11(seed)-0.5),h*0.95),vec2(h*0.22,h*0.2)));
 return min(d,c+(fbm3(p*5./h+seed)-0.5)*0.22*h);}
float sdWillow(vec2 p){
 float d=sdUCap(p,vec2(0.,-0.3),vec2(-0.2,1.6),0.14,0.08);
 d=smin(d,sdUCap(p,vec2(-0.2,1.6),vec2(-0.95,2.35),0.08,0.03),0.05);
 d=smin(d,sdUCap(p,vec2(-0.15,1.4),vec2(0.75,2.2),0.07,0.03),0.05);
 d=min(d,sdUCap(p,vec2(-0.2,1.6),vec2(-0.1,2.6),0.06,0.02));
 float can=1e5;
 can=min(can,sdEll(p-vec2(-0.9,2.3),vec2(0.55,0.28)));
 can=min(can,sdEll(p-vec2(0.7,2.2),vec2(0.55,0.26)));
 can=min(can,sdEll(p-vec2(-0.1,2.62),vec2(0.6,0.3)));
 can+=(fbm3(p*4.)-0.5)*0.3;
 d=min(d,can);
 float sx=p.x+0.07*sin(T*0.6+p.y*1.3)*(2.5-p.y)*0.35;
 float cell=floor(sx*7.);float fx=fract(sx*7.)-0.5-0.3*(hash11(cell*3.)-0.5);
 float top=2.45-0.25*abs(sx+0.1);
 float len=0.7+1.3*hash11(cell);
 float strand=abs(fx)/7.-0.0045;
 strand=max(strand,max(p.y-top,top-len-p.y));
 strand=max(strand,abs(p.x+0.1)-1.35);
 return min(d,strand);}
float grassLayer(vec2 p,float dens,float hgt,float seed,float wind){
 float cw=1./dens;float cx=floor(p.x/cw);float d=1e5;
 for(int i=-2;i<=2;i++){
  float id=cx+float(i);
  for(int k=0;k<2;k++){
   float sid=id*2.+float(k);
   float bx=(id+hash11(sid*1.37+seed))*cw;
   float bh=hgt*(0.3+0.95*hash11(sid*3.1+seed));
   float y=clamp(p.y,0.,bh);float u=y/bh;
   float ln=(hash11(sid*7.7+seed)-0.5)*min(1.1*bh,3.4*cw)+wind*sin(T*1.3+sid*0.7)*min(0.12*bh,0.6*cw);
   float bxx=bx+ln*u*u;
   float th=cw*0.15*(1.-u)+0.0007;
   d=min(d,length(vec2(p.x-bxx,p.y-y))-th);
  }}
 return d;}

/* ---------- characters (side view, facing +x, feet at y=0) ---------- */
float nHead(vec2 p,vec2 c){
 float d=sdCircle(p-c,0.098);
 d=min(d,sdBox(p-c-vec2(-0.01,0.1),vec2(0.075,0.04))-0.02);

function shotAt(t){ for(const s of SHOTS) if(t>=s.s&&t<s.e) return s; return SHOTS[SHOTS.length-1]; }

function fadeAt(t){

}

}
function shake(t,a){

/* ---------------------------------------------------------------------
   PLAYBACK
   --------------------------------------------------------------------- */
let EV=[],evIdx=0,t0=0,playing=false,endShown=false;
const toA=ft=>t0+(ft-START_AT);
function schedule(now){
  const horizon=now+1.2;
  while(evIdx<EV.length&&EV[evIdx].t<horizon){
    const e=EV[evIdx++];
    if(e.t<START_AT) continue; // when seeking (debug ?t=), events already under way are skipped
    try{ e.fn(toA); }catch(err){ console.error(err); if(Q.has('debug')) fail('audio@'+e.t+': '+err); }
  }
}
let perf0=0,acAtStart=0,fallback=false;
function filmTime(){
  if(!playing) return START_AT;
  if(!fallback&&performance.now()-perf0>1500&&A.ac.currentTime-acAtStart<0.05){ fallback=true; console.warn('audio clock stalled — visual clock fallback'); }
  return fallback ? (performance.now()-perf0)/1000-0.35+START_AT : (A.ac.currentTime-t0)+START_AT;
}

let ema=16.7,lastNow=0,lastAdj=0;
function loop(now){
  requestAnimationFrame(loop);
  const t=filmTime();
  schedule(t);
  renderFrame(t);
  overlays(t);
  if(t>173.8&&!endShown){endShown=true;document.getElementById('replay').style.display='block';}
  if(lastNow){const dt=now-lastNow;ema=ema*0.92+dt*0.08;
    if(now-lastAdj>700){
      if(ema>19.5&&scale>0.5){scale=Math.max(0.5,scale*0.88);rebuildTargets();lastAdj=now;}
      else if(ema<15.8&&scale<1){scale=Math.min(1,scale*1.06);rebuildTargets();lastAdj=now;}
    }}
  lastNow=now;
}

/* ---------------------------------------------------------------------
   BOOT
   --------------------------------------------------------------------- */
const statusEl=document.getElementById('status'), goBtn=document.getElementById('go'), startEl=document.getElementById('start');
function compileAll(done){
  const list=[];
  for(const k in SCENE_SRC){ PROGS[k]=mkProgram(SCENE_SRC[k],k); list.push(PROGS[k]); }
  POST.down=mkProgram(FS_DOWN,'down');POST.blur=mkProgram(FS_BLUR,'blur');POST.comp=mkProgram(FS_COMP,'comp');
  list.push(POST.down,POST.blur,POST.comp);
  const poll=()=>{
    let n=0;
    for(const p of list){
      if(p.ready){n++;continue;}
      if(!pcExt||gl.getProgramParameter(p.p,pcExt.COMPLETION_STATUS_KHR)){ if(finishProgram(p)) n++; else p.ready='bad'; }
    }
    statusEl.textContent='compiling shaders · '+n+' / '+list.length;
    if(list.every(p=>p.ready)) done(list.every(p=>p.ready===true)); else setTimeout(poll,60);
  };
  poll();
}
function warm(){ // draw each scene once so first-use stalls happen before playback
  layout();
  for(const k in PROGS){ const s=SHOTS.find(x=>x.prog===k); if(s) renderFrame(s.s+0.5); }
}
if(gl){
  layout();
  addEventListener('resize',()=>{});
  compileAll(ok=>{
    if(!ok){ statusEl.textContent='shader error — see below'; return; }
    warm();
    if(STILL){
      startEl.style.display='none';
      renderFrame(START_AT);overlays(START_AT);
      document.title='READY';
      return;
    }
    statusEl.textContent='ready';
    goBtn.disabled=false;goBtn.textContent='BEGIN';
    if(Q.has('auto')){ setTimeout(()=>goBtn.click(),50); setInterval(()=>{ if(!errBox.textContent) document.title='LIVE t='+filmTime().toFixed(1)+' scale='+scale.toFixed(2)+' btn='+goBtn.textContent+' fb='+fallback+' ema='+ema.toFixed(1)+' gpu='+(gl.getExtension('WEBGL_debug_renderer_info')?gl.getParameter(gl.getExtension('WEBGL_debug_renderer_info').UNMASKED_RENDERER_WEBGL):'?'); },500); }
  });
}
goBtn.addEventListener('click',async()=>{
  goBtn.disabled=true;goBtn.textContent='TUNING THE QIN…';
  initAudio();
  await Promise.race([A.ac.resume(),new Promise(r=>setTimeout(r,1500))]);
  EV=buildScore();
  // pre-render every guqin string (physical model) so nothing is computed mid-film
  for(let i=0;i<QIN_LIST.length;i++){
    const [t,m,r]=QIN_LIST[i];
    if(t+8>=START_AT) qinRender(m,r);
    if(i%6===5){ goBtn.textContent='TUNING THE QIN · '+Math.round(100*i/QIN_LIST.length)+'%'; await new Promise(res=>setTimeout(res,0)); }
  }
  t0=A.ac.currentTime+0.35;acAtStart=A.ac.currentTime;perf0=performance.now();
  playing=true;evIdx=0;
  startEl.style.opacity=0;setTimeout(()=>startEl.style.display='none',1000);
  requestAnimationFrame(loop);
});
document.getElementById('replay').addEventListener('click',()=>location.reload());
if(Q.has('offline')){ // debug: render a slice of the score offline and report levels per second
  (async()=>{
    const [st,du]=Q.get('offline').split(',').map(Number);
    const off=new OfflineAudioContext(2,Math.ceil(44100*du),44100);
    initAudio(off);
    const ev=buildScore();
    for(const [t,m,r] of QIN_LIST) if(t>=st&&t<st+du) qinRender(m,r);
    const map=ft=>ft-st;
    let n=0,errs=[];
    for(const e of ev){ if(e.t>=st&&e.t<st+du){ try{e.fn(map);n++;}catch(err){errs.push(e.t+':'+err.message);} } }
    const buf=await off.startRendering();
    const L=buf.getChannelData(0),R=buf.getChannelData(1);
    const rows=[];
    for(let s0=0;s0<du;s0++){let pk=0,sq=0,c=0;
      for(let i=s0*44100;i<Math.min((s0+1)*44100,L.length);i++){const v=Math.max(Math.abs(L[i]),Math.abs(R[i]));pk=Math.max(pk,v);sq+=L[i]*L[i];c++;}
      rows.push((st+s0)+':'+pk.toFixed(2)+'/'+(20*Math.log10(Math.sqrt(sq/c)+1e-9)).toFixed(0));}
    errBox.textContent='EVENTS '+n+' ERRORS '+errs.length+' '+errs.slice(0,5).join(' | ')+'\nLEVELS '+rows.join(' ');
    document.title='OFFLINE-DONE '+errBox.textContent;
  })();
}
