<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acrylic Sketchbook</title>
<style>
:root{--ink:#fbf4e6;--muted:#cdbda3;--panel:rgba(32,24,19,.82);--line:rgba(255,235,200,.16);--accent:#ff6b4a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1d1510;color:var(--ink);
  font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
canvas#gl{position:fixed;inset:0;display:block;touch-action:none}
.hand{font-family:"Marker Felt","Chalkboard SE","Comic Sans MS","Bradley Hand",cursive}
header{position:fixed;left:18px;top:14px;pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,.5)}
header h1{margin:0;font-size:26px;font-weight:600}
header p{margin:2px 0 0;color:var(--muted);font-size:13px}
#top{position:fixed;right:16px;top:14px;display:flex;gap:8px}
button{font:600 13px/1 inherit;font-family:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);
  padding:9px 14px;border-radius:999px;cursor:pointer;backdrop-filter:blur(8px)}
button:hover{border-color:rgba(255,235,200,.4)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
#style{position:fixed;right:16px;top:60px;width:260px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:14px 16px;display:none;backdrop-filter:blur(10px)}
#style.open{display:block}
#style label{display:flex;justify-content:space-between;font-size:13px;margin:8px 0 3px}
#style input{width:100%;accent-color:var(--accent)}
#style .note{color:var(--muted);font-size:12px;margin-top:8px}
#strip{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;
  max-width:calc(100vw - 24px);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px;backdrop-filter:blur(10px)}
#thumbs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
#thumbs::-webkit-scrollbar{display:none}
#thumbs img{height:46px;border-radius:5px;border:2px solid transparent;cursor:pointer;opacity:.75;flex:none}
#thumbs img.on{border-color:var(--accent);opacity:1}
#strip button{padding:9px 12px;font-size:15px}
#pg{min-width:72px;text-align:center;color:var(--muted);font-size:12px}
#hint{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);color:var(--muted);font-size:13px;
  background:rgba(0,0,0,.35);padding:5px 12px;border-radius:999px;pointer-events:none;transition:opacity .6s}
#load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:#1d1510;z-index:5;transition:opacity .6s}
#load h2{margin:0;font-size:30px}
#bar{width:260px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#load small{color:var(--muted)}
#busy{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);
  padding:7px 14px;border-radius:999px;display:none;font-size:13px}
#drop{position:fixed;inset:12px;border:3px dashed var(--accent);border-radius:20px;display:none;align-items:center;justify-content:center;
  font-size:24px;background:rgba(30,20,15,.6);z-index:4;pointer-events:none}
@media (max-width:700px){header h1{font-size:20px}header p{display:none}#top{top:48px;left:16px;right:auto}#style{top:94px}#top button{padding:8px 10px}#thumbs img{height:36px}}
</style>
</head>

<script>window.addEventListener('error',e=>{document.title='ERROR: '+e.message+' @'+e.lineno});
window.addEventListener('unhandledrejection',e=>{document.title='ERROR: '+(e.reason&&e.reason.message||e.reason)})</script>
<canvas id="gl"></canvas>
<header><h1 class="hand">Acrylic Marker Sketchbook</h1><p>Photos → bold acrylic paint &amp; marker lines, bound into a travel journal</p></header>
<div id="top">
  <button id="addBtn" class="primary">＋ Add photos</button>
  <button id="styleBtn">🎨 Style</button>
  <button id="sampleBtn">↺ Samples</button>
</div>
<input type="file" id="file" accept="image/*" multiple hidden>
<div id="style">
  <label>Acrylic brush size <b id="vR"></b></label><input type="range" id="sR" min="2" max="8" step="1" value="5">
  <label>Marker line weight <b id="vL"></b></label><input type="range" id="sL" min="0.6" max="3" step="0.1" value="1.5">
  <label>Line detail <b id="vD"></b></label><input type="range" id="sD" min="0.1" max="0.6" step="0.02" value="0.28">
  <label>Colour vibrance <b id="vV"></b></label><input type="range" id="sV" min="0.7" max="2" step="0.05" value="1.35">
  <label>Paint layers <b id="vQ"></b></label><input type="range" id="sQ" min="3" max="12" step="1" value="6">
  <div class="note">Changes repaint every page of the journal.</div>
</div>
<div id="hint">Drag a page corner to turn it · click a page or use ← → · drop photos anywhere</div>
<div id="strip"><button id="prev">‹</button><div id="thumbs"></div><span id="pg"></span><button id="next">›</button></div>
<div id="busy"></div>
<div id="drop" class="hand">Drop photos to paint them into the journal</div>
<div id="load"><h2 class="hand">Mixing paints…</h2><div id="bar"><i></i></div><small id="loadTxt">preparing</small></div>

/* ================= seeded random + helpers ================= */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const mkCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const PWX=1024,PHX=768; // photo size

function grain(ctx,w,h,amt,R){const id=ctx.getImageData(0,0,w,h),d=id.data;for(let i=0;i<d.length;i+=4){const n=(R()-.5)*amt;d[i]+=n;d[i+1]+=n;d[i+2]+=n}ctx.putImageData(id,0,0)}
function vignette(ctx,w,h,a){const g=ctx.createRadialGradient(w/2,h/2,h*.35,w/2,h/2,w*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${a})`);ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}
function lin(ctx,x0,y0,x1,y1,stops){const g=ctx.createLinearGradient(x0,y0,x1,y1);stops.forEach(([o,c])=>g.addColorStop(o,c));return g}
function rad(ctx,x,y,r0,r1,stops){const g=ctx.createRadialGradient(x,y,r0,x,y,r1);stops.forEach(([o,c])=>g.addColorStop(o,c));return g}
function ridge(R,y0,amp,rough,w=PWX){const pts=[];let y=y0;for(let x=0;x<=w;x+=8){y+= (R()-.5)*rough;y+=(y0-y)*0.04;pts.push([x,y+Math.sin(x*0.006+R())*amp*0.3])}
  // add peaks
  return pts.map(([x,y],i)=>[x,y-Math.max(0,Math.sin(x*0.0045*(1+amp/400)+1.3))*amp])}
function fillRidge(ctx,pts,fill,bottom=PHX){ctx.beginPath();ctx.moveTo(0,bottom);pts.forEach(p=>ctx.lineTo(p[0],p[1]));ctx.lineTo(PWX,bottom);ctx.closePath();ctx.fillStyle=fill;ctx.fill()}
function cloud(ctx,R,x,y,s,col,lit){ctx.save();ctx.filter='blur(5px)';for(let i=0;i<7;i++){ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x+(R()-.5)*s*1.6,y+(R()-.5)*s*.25,s*(.35+R()*.4),s*(.12+R()*.1),0,0,7);ctx.fill();
  if(lit){ctx.fillStyle=lit;ctx.beginPath();ctx.ellipse(x+(R()-.5)*s*1.4,y+s*.12,s*(.3+R()*.3),s*.05,0,0,7);ctx.fill()}}ctx.restore()}

    this.mb=new THREE.MeshStandardMaterial({map:texOf(back,true),roughness:.92,alphaTest:.5,side:THREE.BackSide});

  dispose(){for(const m of [this.front,this.back])scene.remove(m);this.geo.dispose();
    [this.mf,this.mb].forEach(m=>{m.map.dispose();m.dispose()})}
}

let sheets=[],book=null;

/* ================= book state, layout & animation ================= */
function heights(){
  const n=sheets.length,onR=sheets.map(s=>s.f<.5);
  const out=[];
  for(let i=0;i<n;i++){
    let hR=BASE,hL=CTH;
    for(let j=i+1;j<n;j++)if(onR[j])hR+=TH3;
    if(i===0){out.push(hR+(hL-hR)*smooth(sheets[0].f));continue}
    hR+=TH3;
    hL=(sheets[0].f>=.5||i===0?CTH:0)+TH3;for(let j=1;j<i;j++)if(!onR[j])hL+=TH3;
    out.push(hR+(hL-hR)*smooth(sheets[i].f)+.02*Math.sin(Math.PI*sheets[i].f));
  }
  return out}
const smooth=t=>t*t*(3-2*t);
let layoutDirty=true;
function layout(){
  const hs=heights();sheets.forEach((s,i)=>s.shape(hs[i]));
  const paperR=sheets.filter((s,i)=>i>0&&s.f<.5&&!s.drag&&Math.abs(s.f-s.target)<1e-3).length,paperL=sheets.filter((s,i)=>i>0&&s.f>=.5&&!s.drag&&Math.abs(s.f-s.target)<1e-3).length;
  const bR=Math.max(0,paperR-1)*TH3,bL=Math.max(0,paperL-1)*TH3;
  blockR.visible=bR>0;blockR.scale.y=Math.max(1e-4,bR);blockR.position.set(R0+PW/2,BASE+bR/2,0);blockR.material.map.repeat.set(1,Math.max(1,paperR));
  blockL.visible=bL>0;blockL.scale.y=Math.max(1e-4,bL);blockL.position.set(-R0-PW/2,CTH+bL/2,0);blockL.material.map.repeat.set(1,Math.max(1,paperL));
  const tot=CTH+BASE+(sheets.length-1)*TH3,rw=Math.max(.06,tot*.75+.02);
  wire.position.set(0,BASE+tot*.35,0);wire.children.forEach(r=>{r.scale.set(rw,rw,rw)});
}
function spread(){let k=0;sheets.forEach(s=>{if(s.target===1)k++});return k}
function step(dt){
  let moving=false;
  sheets.forEach(s=>{
    if(s.drag){moving=true;return}
    if(s.delay>0){s.delay-=dt;return}
    const d=s.target-s.f;
    if(Math.abs(d)<1e-3&&Math.abs(s.vel)<1e-3){if(s.f!==s.target||s.kappa||s.tau){s.f=s.target;s.vel=0;s.kappa=0;s.tau=0;moving=true}return}
    moving=true;
    const acc=60*d-11*s.vel;s.vel+=acc*dt;s.f+=s.vel*dt;s.f=Math.max(0,Math.min(1,s.f));
    if(s.rigid){s.kappa=0}else{
      s.kappa+=(-.75*Math.sin(Math.PI*s.f)*Math.sign(s.vel||1)-s.kappa)*Math.min(1,dt*10);
      s.tau*=Math.exp(-dt*3)}

  if(moving||layoutDirty){layout();layoutDirty=false}
}
function go(k){
  k=Math.max(0,Math.min(sheets.length,k));const cur=spread();
  sheets.forEach((s,i)=>{const t=i<k?1:0;if(s.target!==t){s.target=t;s.delay=Math.abs((t?i-cur:cur-1-i))*.14}});
  updateStrip(k);
}
const snapAll=()=>{sheets.forEach(s=>{s.f=s.target;s.vel=0;s.delay=0;s.kappa=s.tau=0});layout()};
const next=()=>go(spread()+1),prev=()=>go(spread()-1);

const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),-.06),hit=new THREE.Vector3();
function pick(e){ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);return ray.ray.intersectPlane(plane,hit)?hit.clone():null}
let ptr=null;
canvas.addEventListener('pointerdown',e=>{
  const p=pick(e);if(!p||Math.abs(p.z)>CHH/2+.1)return;
  let s=null,dir=0;
  if(p.x>R0*0.5&&p.x<R0+CW+.1){s=sheets.find(q=>q.target===0);dir=1}
  else if(p.x<-R0*0.5&&p.x>-R0-CW-.1){s=[...sheets].reverse().find(q=>q.target===1);dir=-1}
  if(!s)return;
  canvas.setPointerCapture(e.pointerId);
  ptr={s,dir,x0:e.clientX,y0:e.clientY,moved:false,lastF:s.f,t:performance.now(),v:0};
});
canvas.addEventListener('pointermove',e=>{
  if(!ptr){const p=pick(e);canvas.style.cursor=p&&Math.abs(p.z)<PH/2&&Math.abs(p.x)<R0+CW?'grab':'default';parallax(e);return}
  if(!ptr.moved&&Math.hypot(e.clientX-ptr.x0,e.clientY-ptr.y0)<6)return;
  ptr.moved=true;canvas.style.cursor='grabbing';
  const s=ptr.s,p=pick(e);if(!p)return;
  s.drag=true;s.delay=0;
  const f=Math.acos(Math.max(-1,Math.min(1,p.x/(R0+PW))))/Math.PI;
  const now=performance.now(),dt=Math.max(1,now-ptr.t)/1000;ptr.v=(f-s.f)/dt;ptr.t=now;
  s.f=f;s.vel=0;
  if(!s.rigid){s.kappa=ptr.dir*.45*Math.sin(Math.PI*f);s.tau=ptr.dir*Math.max(-1,Math.min(1,p.z/(PH/2)))*1.1*Math.sin(Math.PI*f)}

});
function endPtr(){
  if(!ptr)return;const {s,dir,moved,v}=ptr;ptr=null;canvas.style.cursor='default';
  if(!moved){dir>0?next():prev();return}
  s.drag=null;
  const done=dir>0?(s.f>.5||v>1.2):(s.f<.5||v<-1.2);
  s.target=done?(dir>0?1:0):(dir>0?0:1);s.vel=v*.3;

}
canvas.addEventListener('pointerup',endPtr);canvas.addEventListener('pointercancel',endPtr);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});
$('next').onclick=next;$('prev').onclick=prev;
let par={x:0,y:0};function parallax(e){par.x=(e.clientX/innerWidth-.5);par.y=(e.clientY/innerHeight-.5)}
let zoom=1;canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.6,Math.min(1.25,zoom*(1+Math.sign(e.deltaY)*.06)))},{passive:false});

/* ================= camera ================= */
let camX=0;
function placeCamera(dt){
  const k=spread(),n=sheets.length,tx=k===0?(R0+CW/2)*.85:k>=n?-(R0+CW/2)*.85:0;
  camX+=(tx-camX)*Math.min(1,dt*2.5);
  const asp=innerWidth/innerHeight,vf=THREE.MathUtils.degToRad(camera.fov),need=Math.max((CHH+.5)/2/Math.tan(vf/2),(2*(R0+CW)+.3)/2/Math.tan(vf/2)/asp);
  const d=need*zoom*1.02,el=THREE.MathUtils.degToRad(62-par.y*6);
  camera.position.set(camX+par.x*.25+Math.cos(el)*0,Math.sin(el)*d,Math.cos(el)*d+.08);
  camera.lookAt(camX,0,.08);
}

/* ================= journal build ================= */
let items=[];
function setLoad(t,p){$('loadTxt').textContent=t;$('bar').firstElementChild.style.width=(p*100|0)+'%'}
const tick=()=>new Promise(r=>setTimeout(r,0));
async function paintAll(msg){
  for(let i=0;i<items.length;i++){
    setLoad(`${msg} ${i+1} / ${items.length}: ${items[i].title}`,(i+.5)/items.length);
    if($('load').style.display==='none'){$('busy').style.display='block';$('busy').textContent=`${msg} ${i+1} / ${items.length}…`}
    await tick();items[i].styl=stylize(items[i].photo,i*7.3+1);items[i].pal=palette(items[i].styl);
  }
  $('busy').style.display='none';
}
function buildBook(keep){
  const k=keep?spread():0;
  sheets.forEach(s=>s.dispose());sheets=[];
  const pages=[titlePage(true,items.length)];
  items.forEach((it,i)=>pages.push(photoPage(it,(i+1)%2===0,i)));
  pages.push(endPage(pages.length%2===0));
  if(pages.length%2)pages.push(endpaper(false,44));
  // page list alternates right (spine left) / left (spine right); re-render with correct spine sides
  const sides=pages.map((c,i)=>c);
  const ep=endpaper(false,12);
  sheets.push(new Cover(leather(true),ep));
  for(let i=0;i<sides.length;i+=2)sheets.push(new Sheet(sheets.length,sides[i],sides[i+1]));
  backTop.map&&backTop.map.dispose();backTop.map=texOf(endpaper(true,33));backTop.needsUpdate=true;
  sheets.forEach((s,i)=>{s.f=s.target=i<k?1:0});
  layoutDirty=true;buildStrip(sides,ep);updateStrip(Math.min(k,sheets.length));
}
/* thumbnails of each spread */
let thumbs=[];
function buildStrip(sides,ep){
  const el=$('thumbs');el.innerHTML='';thumbs=[];
  const cover=leather(true),spreads=[[null,cover],[ep,sides[0]]];
  for(let i=1;i<sides.length;i+=2)spreads.push([sides[i],sides[i+1]||null]);
  spreads[spreads.length-1][1]=spreads[spreads.length-1][1]||null;
  spreads.push([sides[sides.length-1],null]);
  spreads.forEach((sp,k)=>{
    if(k===spreads.length-1)return;
    const c=mkCanvas(140,96),ctx=c.getContext('2d');ctx.fillStyle='#2a1f18';ctx.fillRect(0,0,140,96);
    if(sp[0])ctx.drawImage(sp[0],2,2,68,92);if(sp[1])ctx.drawImage(sp[1],70,2,68,92);
    const img=new Image();img.src=c.toDataURL('image/jpeg',.7);img.title=k===0?'Cover':'Spread '+k;img.onclick=()=>go(k);el.appendChild(img);thumbs.push(img)});
}
function updateStrip(k){thumbs.forEach((t,i)=>t.classList.toggle('on',i===k));
  $('pg').textContent=k===0?'Cover':k>=sheets.length?'Back':`Spread ${k} / ${sheets.length-1}`;
  thumbs[k]&&thumbs[k].scrollIntoView({block:'nearest',inline:'center'})}

/* ================= uploads + style controls ================= */
function fitPhoto(img){const c=mkCanvas(PWX,PHX),ctx=c.getContext('2d'),s=Math.max(PWX/img.width,PHX/img.height);
  ctx.drawImage(img,(PWX-img.width*s)/2,(PHX-img.height*s)/2,img.width*s,img.height*s);return c}
async function addFiles(files){
  files=[...files].filter(f=>f.type.startsWith('image/'));if(!files.length)return;
  const added=[];
  for(const f of files){const url=URL.createObjectURL(f);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const name=f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').slice(0,22)||'Snapshot';
    added.push({title:name.charAt(0).toUpperCase()+name.slice(1),sub:`Day ${items.length+added.length+1} · ${new Date(f.lastModified).toLocaleDateString()}`,note:'',photo:fitPhoto(img)});URL.revokeObjectURL(url)}
  const start=items.length;items.push(...added);
  for(let i=start;i<items.length;i++){$('busy').style.display='block';$('busy').textContent=`Painting ${i-start+1} / ${added.length}…`;await tick();
    items[i].styl=stylize(items[i].photo,i*7.3+1);items[i].pal=palette(items[i].styl)}
  $('busy').style.display='none';
  buildBook(false);setTimeout(()=>go(Math.ceil((start+2)/2)),300);
}
$('addBtn').onclick=()=>$('file').click();
$('file').onchange=e=>{addFiles(e.target.files);e.target.value=''};
let dragDepth=0;
addEventListener('dragenter',e=>{e.preventDefault();dragDepth++;$('drop').style.display='flex'});
addEventListener('dragleave',e=>{dragDepth--;if(dragDepth<=0){$('drop').style.display='none';dragDepth=0}});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dragDepth=0;$('drop').style.display='none';addFiles(e.dataTransfer.files)});
$('styleBtn').onclick=()=>$('style').classList.toggle('open');
$('sampleBtn').onclick=async()=>{items=SAMPLES.map((s,i)=>({...s,photo:samplePhoto(i)}));await paintAll('Painting');buildBook(false)};
const sliders=[['sR','vR','R',v=>v.toFixed(0)],['sL','vL','lineW',v=>v.toFixed(1)],['sD','vD','thr',v=>(1-v).toFixed(2)],['sV','vV','vib',v=>v.toFixed(2)],['sQ','vQ','levels',v=>v.toFixed(0)]];
let restyleT=0;
sliders.forEach(([s,v,k,f])=>{const el=$(s),out=$(v);out.textContent=f(+el.value);
  el.oninput=()=>{style[k]=+el.value;out.textContent=f(style[k]);clearTimeout(restyleT);restyleT=setTimeout(async()=>{await paintAll('Repainting');buildBook(true)},350)}});

/* ================= main loop ================= */
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);
let last=performance.now(),autoT=0,autoStage=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(AUTO)autoplay(dt);
  step(dt);placeCamera(dt);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
function autoplay(dt){
  const mode=Q.get('autotest');
  autoT+=dt;
  if(mode==='mid'){ // freeze a page mid-turn, curled and twisted
    if(autoStage===0){go(2);snapAll();const s=sheets[2];s.drag=true;s.f=+(Q.get('f')||.42);s.kappa=-.55;s.tau=.5;layout();autoStage=1}
    return}
  if(mode==='closed')return;
  if(mode==='upload'){ // exercise the real upload path with a generated JPEG
    if(autoStage===0){autoStage=1;const c=samplePhoto(3);const g=c.getContext('2d');g.fillStyle='#e33';g.beginPath();g.arc(200,200,120,0,7);g.fill();
      c.toBlob(b=>addFiles([new File([b],'my_beach-trip.jpg',{type:'image/jpeg',lastModified:Date.now()})]).then(()=>{go(4);snapAll()}),'image/jpeg',.9)}
    return}
  const n=+mode;if(mode&&!isNaN(n)){if(autoStage===0){go(n);snapAll();autoStage=1}return}
  if(autoT>2.2){autoT=0;spread()>=sheets.length?go(0):next()}
}
(async()=>{
  setLoad('drawing sample photos',.02);await tick();
  items=SAMPLES.map((s,i)=>({...s,photo:samplePhoto(i)}));
  await paintAll('Painting');
  buildBook(false);layout();
  $('load').style.opacity=0;setTimeout(()=>$('load').style.display='none',600);
  setTimeout(()=>$('hint').style.opacity=0,9000);
  if(!AUTO)setTimeout(()=>{if(spread()===0)go(1)},900);
  requestAnimationFrame(frame);
})();
</script>
