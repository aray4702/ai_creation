<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paper Sky · Painterly Music Video Engine</title>
<style>
  :root{
    --ink:#f3ecdc; --dim:#a79f8e; --accent:#e0563f; --panel:rgba(18,16,22,.72); --line:rgba(255,240,220,.16);
    --serif:Georgia,"Times New Roman",serif; --sans:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  html,body{margin:0;height:100%;background:#0d0b10;overflow:hidden;color:var(--ink);font-family:var(--sans)}
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hud{position:fixed;top:14px;left:16px;font:11px/1.55 ui-monospace,Menlo,monospace;color:#e9e1cf;background:var(--panel);
       border:1px solid var(--line);border-radius:8px;padding:9px 12px;backdrop-filter:blur(6px);max-width:min(360px,calc(100vw - 32px));
       transition:opacity .4s}
  #hud b{color:var(--accent);font-weight:600}
  #hud .k{color:var(--dim)}
  #bar{position:fixed;left:16px;right:16px;bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
       background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;backdrop-filter:blur(6px);transition:opacity .4s}
  #bar button,.btn{font:12px var(--sans);color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);
       border-radius:6px;padding:6px 10px;cursor:pointer;white-space:nowrap}
  #bar button:hover,.btn:hover{border-color:var(--accent)}
  #play{width:38px;font-size:15px!important}
  #time{font:12px ui-monospace,Menlo,monospace;color:var(--dim);min-width:92px}
  #seek{flex:1 1 180px;accent-color:var(--accent)}
  #vol{width:80px;accent-color:var(--accent)}
  #spec{height:38px;width:220px;border-radius:4px;background:rgba(0,0,0,.25)}
  .hide{opacity:0;pointer-events:none}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
         background:radial-gradient(ellipse at 50% 35%,#3a2433 0%,#140f16 60%,#0b090d 100%);z-index:5;text-align:center;padding:0 16px;transition:opacity .8s}
  #start h1{font:italic 400 clamp(38px,7vw,84px)/1 var(--serif);margin:0;letter-spacing:.02em}
  #start h1 span{color:var(--accent)}
  #start p{margin:0;color:var(--dim);font:14px/1.6 var(--serif);max-width:560px}
  #start .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  #start .btn{font-size:14px;padding:11px 18px}
  #start .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  #status{font:12px ui-monospace,Menlo,monospace;color:var(--dim);min-height:1.4em}
  #prog{width:min(360px,80vw);height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
  #prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  #drop{position:fixed;inset:0;border:3px dashed var(--accent);display:none;z-index:9;pointer-events:none}
  input[type=file]{display:none}
  @media (max-width:640px){ #spec{width:100%;order:9} #hud{font-size:10px} }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud"></div>
<div id="bar" class="hide">
  <button id="play" title="Play / pause (space)">▶</button>
  <span id="time">0:00 / 0:00</span>
  <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
  <canvas id="spec" width="440" height="76" aria-label="Live spectrum"></canvas>
  <input id="vol" type="range" min="0" max="100" value="85" aria-label="Volume">
  <button id="loadSong">Song…</button>
  <button id="loadLyr">Lyrics…</button>
  <button id="fs" title="Fullscreen">⛶</button>
</div>
<div id="start">
  <h1>Paper <span>Sky</span></h1>
  <p>A painterly music-video engine. Six cooperating agents — listener, lyricist, director, scene, painter and composer — turn a song and its lyrics into a hand-painted animated film, live.</p>
  <div class="row">
    <button class="btn primary" id="demo">▶ Play the demo song</button>
    <button class="btn" id="own">Load your own song…</button>
    <button class="btn" id="ownLyr">+ lyrics (.lrc / .txt)</button>
  </div>
  <div id="prog"><i></i></div>
  <div id="status">or drop an audio file (and an .lrc) anywhere</div>
</div>
<div id="drop"></div>
<input id="fSong" type="file" accept="audio/*">
<input id="fLyr" type="file" accept=".lrc,.txt,text/plain">
<script>
'use strict';
/* =======================================================================
   PAPER SKY — multi-agent painterly music video engine
   Agents (each a module with one job, communicating through the shared
   timeline in `W` — the "world state"):
     ComposerAgent  synthesizes the built-in demo song (Web Audio, offline)
     ListenerAgent  analyses the track: FFT → onsets → tempo → beat grid,
                    band energies; plus live AnalyserNode features per frame
     LyricistAgent  parses LRC / plain lyrics → timed lines + reveal progress
     DirectorAgent  maps song sections & energy to scenes, transitions on
                    downbeats, camera drift and beat punches
     SceneAgent     renders procedural scenes (GLSL) for the current plan
     PainterAgent   re-paints every frame as layered brush strokes following
                    a flow field whose speed is driven by the music
   ======================================================================= */
const Q=new URLSearchParams(location.search);
const $=id=>document.getElementById(id);
const W={ // shared world state
  buffer:null, dur:150, analysis:null, plan:null, lyrics:[], hints:null, title:'',
  live:{bass:0,mid:0,high:0,energy:0,flux:0,onset:0}, beatCount:0, beatPulse:0, downPulse:0,
};

/* =========================== SCENE SHADER =========================== */
const GLSL_COMMON=`
float sat(float x){return clamp(x,0.,1.);}
float hash11(float p){p=fract(p*.1031);p*=p+33.33;p*=p+p;return fract(p);}
float hash21(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
vec2 hash22(vec2 p){vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973));p3+=dot(p3,p3.yzx+33.33);return fract((p3.xx+p3.yz)*p3.zy);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);
 return mix(mix(hash21(i),hash21(i+vec2(1,0)),u.x),mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),u.x),u.y);}
const mat2 FM=mat2(1.6,1.2,-1.2,1.6);
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*noise(p);p=FM*p+3.1;a*=.5;}return s;}
float fbm3(vec2 p){float s=0.,a=.5;for(int i=0;i<3;i++){s+=a*noise(p);p=FM*p+3.1;a*=.5;}return s*1.14;}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,s,-s,c);}
`;
const FS_SCENE=`#version 300 es
precision highp float;
uniform vec2 uRes;uniform float uT,uSP,uScene,uVar,uBass,uMid,uHigh,uEnergy,uBeat,uBeatCount,uLP;uniform vec3 uCam;
out vec4 o;
${GLSL_COMMON}
const float PI=3.14159265;
float sdCircle(vec2 p,float r){return length(p)-r;}
float sdSeg(vec2 p,vec2 a,vec2 b){vec2 pa=p-a,ba=b-a;float h=sat(dot(pa,ba)/dot(ba,ba));return length(pa-ba*h);}
float sdEll(vec2 p,vec2 r){float k0=length(p/r);float k1=length(p/(r*r));return k0*(k0-1.)/max(k1,1e-5);}
float sdTrap(vec2 p,float r1,float r2,float he){
 vec2 k1=vec2(r2,he);vec2 k2=vec2(r2-r1,2.*he);p.x=abs(p.x);
 vec2 ca=vec2(p.x-min(p.x,(p.y<0.)?r1:r2),abs(p.y)-he);
 vec2 cb=p-k1+k2*sat(dot(k1-p,k2)/dot(k2,k2));
 float s=(cb.x<0.&&ca.y<0.)?-1.:1.;return s*sqrt(min(dot(ca,ca),dot(cb,cb)));}
float smin(float a,float b,float k){float h=sat(.5+.5*(b-a)/k);return mix(b,a,h)-k*h*(1.-h);}
vec2 limb(vec2 o,float a,float l){return o+l*vec2(sin(a),-cos(a));}
void draw(inout vec3 c,inout float det,float d,vec3 col,float detail,float aa){
 float a=1.-smoothstep(-aa,aa,d);c=mix(c,col,a);det=mix(det,detail,a);}

/* ---- the traveller: one character, many poses. facing +x, feet at 0, ~1 tall ---- */
float figure(vec2 p,float pose,float ph,out float dScarf,out vec2 handR){
 vec2 hip;float lean=0.,tl,tr,sl,sr,ual,uar,fal,far;float s=sin(ph);
 if(pose<0.5){ // walk
  hip=vec2(0.,0.49+0.02*abs(cos(ph)));lean=0.06;
  tl=0.45*s;sl=tl-0.55*max(0.,-s)-0.05;tr=-0.45*s;sr=tr-0.55*max(0.,s)-0.05;
  ual=-0.4*s;fal=ual+0.35;uar=0.4*s;far=uar+0.35;
 } else if(pose<1.5){ // dance
  hip=vec2(0.03*s,0.49+0.03*abs(sin(ph)));lean=0.14*s;
  tl=0.12+0.2*s;sl=tl-0.1;float k=max(0.,sin(ph*0.5+1.));tr=-0.2+0.7*k;sr=tr-0.8*k;
  ual=2.5+0.45*sin(ph);fal=ual+0.6*sin(ph*2.);uar=-2.3+0.45*sin(ph+1.5);far=uar-0.5*sin(ph*2.+1.);
 } else if(pose<2.5){ // row (seated)
  hip=vec2(0.,0.16);lean=0.2+0.3*s;
  tl=1.5;sl=0.4;tr=1.45;sr=0.35;
  ual=1.0+0.55*s;fal=ual+0.45;uar=ual+0.08;far=fal+0.05;
 } else if(pose<3.5){ // float
  hip=vec2(0.,0.5);lean=0.15*s;
  tl=0.35+0.15*s;sl=tl-0.4;tr=-0.25+0.1*sin(ph+1.);sr=tr-0.3;
  ual=2.4+0.2*s;fal=ual+0.25;uar=1.7+0.3*sin(ph+2.);far=uar+0.25;
 } else { // stand, right arm up (kite string)
  hip=vec2(0.,0.49);lean=-0.05+0.03*s;
  tl=0.12;sl=0.1;tr=-0.12;sr=-0.1;
  ual=0.25+0.05*s;fal=0.4;uar=2.25+0.12*s;far=2.55+0.12*s;
 }
 vec2 dir=vec2(sin(lean),cos(lean));
 vec2 neck=hip+dir*0.36,head=hip+dir*0.47,sh=hip+dir*0.33;
 float d=sdCircle(p-head,0.072);
 d=min(d,sdCircle(p-head-vec2(-0.055,0.035),0.042));
 d=min(d,sdSeg(p,hip,neck)-0.05);
 d=smin(d,sdEll(p-(hip+dir*0.26),vec2(0.068,0.085)),0.03);
 vec2 kl=limb(hip,tl,0.24),fl=limb(kl,sl,0.24),kr=limb(hip,tr,0.24),fr=limb(kr,sr,0.24);
 d=min(d,sdSeg(p,hip,kl)-0.04);d=min(d,sdSeg(p,kl,fl)-0.032);
 d=min(d,sdSeg(p,hip,kr)-0.04);d=min(d,sdSeg(p,kr,fr)-0.032);
 vec2 el=limb(sh,ual,0.17),hl=limb(el,fal,0.16),er=limb(sh,uar,0.17);handR=limb(er,far,0.16);
 d=min(d,sdSeg(p,sh,el)-0.027);d=min(d,sdSeg(p,el,hl)-0.023);
 d=min(d,sdSeg(p,sh,er)-0.027);d=min(d,sdSeg(p,er,handR)-0.023);
 if(pose<1.5||pose>2.5){
  vec2 q=rot(lean*0.5)*(p-hip-vec2(0.,-0.1));q.x-=0.04*sin(ph*2.)*(-q.y);
  d=smin(d,sdTrap(q,0.17,0.07,0.13),0.02);
 }
 vec2 sp=p-neck;float x=-sp.x;
 float cy=-0.03*x+0.05*sin(x*13.-uT*7.)*x*1.6;
 dScarf=max(abs(sp.y-cy)-0.024*(1.-x/0.55)-0.005,max(-x,x-0.55));
 dScarf=min(dScarf,sdCircle(sp-vec2(0.,-0.01),0.045));
 return d;}
void drawFigure(inout vec3 c,inout float det,vec2 w,vec2 pos,float sc,float flip,float pose,vec3 inkC,vec3 rimC,float aa,out vec2 handW){
 vec2 fp=(w-pos)/sc;fp.x*=flip;
 float ds;vec2 hr;float d=figure(fp,pose,uBeatCount*PI,ds,hr);
 float ds2;vec2 hr2;float dL=figure(fp+vec2(-0.03*flip,-0.03),pose,uBeatCount*PI,ds2,hr2);
 vec3 col=inkC+rimC*smoothstep(-0.01,0.03,dL);
 draw(c,det,d*sc,col,1.,aa);
 draw(c,det,ds*sc,vec3(0.86,0.16,0.12)*(0.9+0.3*uBeat),1.,aa);
 hr.x*=flip;handW=pos+hr*sc;}
float stars(vec2 p,float dens,float tw){
 vec2 g=p*dens;vec2 id=floor(g);vec2 f=fract(g)-0.5;vec2 o=hash22(id)-0.5;
 float h=hash21(id+3.);
 return step(0.86,h)*smoothstep(0.09,0.,length(f-o*0.7))*(0.6+0.4*sin(uT*3.+h*40.)*tw);}
float waves(vec2 w,float t){
 return sin(w.x*18.+t*1.4+sin(w.x*5.+t)*1.5)*0.5+sin(w.x*41.-t*2.1)*0.25;}

/* ---------------- 0 · MEADOW — walking at dawn ---------------- */
vec4 meadow(vec2 p){
 float sp=uSP;vec2 cam=vec2(mix(-0.3,0.3,sp),0.)+uCam.xy;float z=uCam.z;
 vec2 w=p*z+cam;float aa=1.5*z/uRes.y;float det=0.;
 vec3 top=uVar>0.5?vec3(0.33,0.3,0.6):vec3(0.4,0.6,0.92);
 vec3 hor=uVar>0.5?vec3(1.,0.58,0.4):vec3(1.,0.76,0.55);
 vec3 c=mix(hor,top,smoothstep(-0.05,0.5,p.y));
 vec2 sun=vec2(0.36,0.17);float sd=length(p-sun);
 c+=vec3(1.,0.78,0.45)*(0.25+0.5*uBass)*exp(-sd*5.);
 draw(c,det,sd-0.055,vec3(1.,0.96,0.82),0.3,aa);
 vec2 wc=p*z+cam*0.15;
 float cl=fbm(wc*vec2(2.2,6.)+vec2(uT*0.015,0.));
 c=mix(c,vec3(1.,0.9,0.86),smoothstep(0.55,0.75,cl)*smoothstep(0.,0.25,p.y)*0.85);
 vec2 wm=p*z+cam*0.3;
 draw(c,det,wm.y-(-0.03+0.14*fbm(vec2(wm.x*2.,1.))),mix(vec3(0.55,0.48,0.74),hor,0.35),0.,aa*3.);
 vec2 w1=p*z+cam*0.6;
 draw(c,det,w1.y-(-0.12+0.05*sin(w1.x*3.+1.)),vec3(0.5,0.66,0.42),0.05,aa*2.);
 draw(c,det,w.y-(-0.2+0.04*sin(w.x*2.2+2.)),vec3(0.38,0.6,0.32),0.1,aa);
 float fx=mix(-0.42,0.42,sp);float gy=-0.2+0.04*sin(fx*2.2+2.);
 vec2 hw;drawFigure(c,det,w,vec2(fx,gy-0.005),0.25,1.,0.,vec3(0.16,0.14,0.24),vec3(1.,0.75,0.5),aa,hw);
 for(int i=0;i<3;i++){float fi=float(i);
  vec2 bp=vec2(mod(uT*0.05+fi*0.3,1.6)-0.8,0.2+0.05*fi)*vec2(1.,1.)+vec2(0.,0.01*sin(uT+fi));
  vec2 q=p-bp;float fl=sin(uT*9.+fi)*0.4;
  float bd=min(sdSeg(q,vec2(0.),vec2(-0.02,0.012*fl+0.008)),sdSeg(q,vec2(0.),vec2(0.02,0.012*fl+0.008)))-0.002;
  draw(c,det,bd,vec3(0.2,0.18,0.25),0.4,aa);}
 vec2 wf=p*z+cam*1.35;
 float fy=-0.37+0.03*sin(wf.x*3.);
 draw(c,det,wf.y-fy,vec3(0.3,0.52,0.26),0.15,aa);
 float id=floor(wf.x*16.);
 for(int k=-1;k<=1;k++){float ii=id+float(k);
  float fxx=(ii+hash11(ii))/16.;float fh=fy+0.03+0.07*hash11(ii*3.)+0.005*sin(uT*2.+ii);
  draw(c,det,max(abs(wf.x-fxx)-0.0025,max(wf.y-fh,fy-wf.y)),vec3(0.25,0.45,0.2),0.3,aa);
  float hu=hash11(ii*7.);vec3 fc=hu<0.33?vec3(0.95,0.3,0.25):(hu<0.66?vec3(1.,0.85,0.3):vec3(1.,0.97,0.92));
  draw(c,det,length(wf-vec2(fxx,fh))-0.014*(1.+0.3*uBeat),fc,0.7,aa);}
 return vec4(c,det);}

/* ---------------- 1 · KITE HILL — wind and cloud ---------------- */
vec4 kiteHill(vec2 p){
 float sp=uSP;vec2 cam=vec2(0.,mix(-0.04,0.07,sp))+uCam.xy;float z=uCam.z*mix(1.08,0.94,sp);
 vec2 w=p*z+cam;float aa=1.5*z/uRes.y;float det=0.;
 vec3 top=uVar>0.5?vec3(0.3,0.24,0.52):vec3(0.3,0.52,0.9);
 vec3 hor=uVar>0.5?vec3(1.,0.55,0.42):vec3(0.8,0.9,1.);
 vec3 c=mix(hor,top,smoothstep(-0.3,0.5,p.y));
 vec2 wc=p*z+cam*0.3+vec2(uT*0.03*(1.+uEnergy),0.);
 float cl=fbm(wc*vec2(1.6,2.6));
 vec3 cc=(uVar>0.5?vec3(1.,0.72,0.62):vec3(1.))*(0.82+0.3*fbm3(wc*7.));
 c=mix(c,cc,smoothstep(0.5,0.6,cl)*0.9);
 draw(c,det,(p*z+cam*0.5).y-(-0.2+0.08*fbm(vec2((p*z+cam*0.5).x*2.,4.))),uVar>0.5?vec3(0.45,0.3,0.45):vec3(0.45,0.62,0.55),0.,aa*2.);
 float hill=w.y-(-0.3+0.2*exp(-w.x*w.x*3.));
 draw(c,det,hill,uVar>0.5?vec3(0.35,0.32,0.28):vec3(0.4,0.62,0.3),0.15,aa);
 vec2 pos=vec2(-0.02,-0.1+0.001);
 vec2 hw;drawFigure(c,det,w,pos,0.3,1.,4.,vec3(0.15,0.13,0.22),vec3(1.,0.85,0.6),aa,hw);
 vec2 k=vec2(0.42+0.05*sin(uT*0.9),0.3+0.04*sin(uT*1.3)+0.02*uBeat);
 vec2 mid=(hw+k)*0.5+vec2(0.03,-0.04);
 float str=min(sdSeg(w,hw,mid),sdSeg(w,mid,k))-0.0012;
 draw(c,det,str,vec3(0.95,0.95,0.9),0.9,aa);
 vec2 q=rot(0.25*sin(uT*1.1))*(w-k);
 float kd=(abs(q.x)/0.055+abs(q.y)/0.08-1.)*0.04;
 vec3 kc=q.x*q.y>0.?vec3(0.9,0.2,0.15):vec3(1.,0.8,0.25);
 draw(c,det,kd,kc,1.,aa);
 for(int i=1;i<7;i++){float fi=float(i);
  vec2 tp=k+vec2(-0.025*fi,-0.075-0.04*fi)+vec2(0.018*sin(uT*4.-fi*0.9),0.);
  draw(c,det,sdEll(tp-w,vec2(0.012,0.006)),mod(fi,2.)<0.5?vec3(0.9,0.2,0.15):vec3(1.,0.85,0.3),0.8,aa);}
 float gid=floor(w.x*50.);
 for(int j=-1;j<=1;j++){float ii=gid+float(j);float gx=(ii+hash11(ii))/50.;
  float gb=-0.3+0.2*exp(-gx*gx*3.);float gh=0.04+0.05*hash11(ii*2.);
  float ben=(0.02+0.03*uEnergy)*sin(uT*2.5+ii*0.3);
  float yy=clamp(w.y,gb,gb+gh);float u=(yy-gb)/gh;
  draw(c,det,abs(w.x-gx-ben*u*u)-0.002*(1.-u)-0.0005+max(w.y-gb-gh,0.)+max(gb-0.03-w.y,0.)*10.,uVar>0.5?vec3(0.25,0.24,0.2):vec3(0.3,0.5,0.22),0.3,aa);}
 return vec4(c,det);}

/* ---------------- 2 · BLOSSOM — dancing under the tree ---------------- */
vec4 blossom(vec2 p){
 float sp=uSP;vec2 cam=vec2(mix(-0.08,0.08,sp),0.)+uCam.xy;float z=uCam.z;
 vec2 w=p*z+cam;float aa=1.5*z/uRes.y;float det=0.;
 bool night=uVar>0.5;
 vec3 c=night?mix(vec3(0.16,0.12,0.3),vec3(0.03,0.03,0.1),smoothstep(-0.3,0.5,p.y))
             :mix(vec3(1.,0.82,0.7),vec3(0.95,0.58,0.7),smoothstep(-0.3,0.5,p.y));
 if(night) c+=vec3(0.9,0.9,1.)*stars(p+vec2(uT*0.002,0.),60.,1.+uHigh)*0.8;
 else c+=vec3(1.,0.85,0.6)*(0.2+0.35*uBass)*exp(-length(p-vec2(0.45,0.25))*4.);
 draw(c,det,(p*z+cam*0.4).y-(-0.22+0.05*sin((p*z+cam*0.4).x*4.)),night?vec3(0.18,0.14,0.3):vec3(0.9,0.62,0.66),0.,aa*2.);
 float gnd=w.y-(-0.3+0.015*sin(w.x*6.));
 draw(c,det,gnd,night?vec3(0.2,0.14,0.26):vec3(0.8,0.55,0.55),0.1,aa);
 vec2 tb=vec2(-0.36,-0.31);
 float tr=sdSeg(w,tb,tb+vec2(0.05,0.36))-mix(0.04,0.022,sat((w.y-tb.y)/0.36));
 tr=min(tr,sdSeg(w,tb+vec2(0.05,0.3),vec2(-0.6,0.2))-0.014);
 tr=min(tr,sdSeg(w,tb+vec2(0.05,0.33),vec2(-0.08,0.24))-0.014);
 tr=min(tr,sdSeg(w,tb+vec2(0.05,0.35),vec2(-0.3,0.36))-0.012);
 draw(c,det,tr,night?vec3(0.12,0.08,0.1):vec3(0.35,0.2,0.18),0.4,aa);
 float can=1e5;
 for(int i=0;i<6;i++){float fi=float(i);
  vec2 cc=vec2(-0.34,0.2)+vec2(cos(fi*1.2)*0.2,sin(fi*1.9)*0.08+0.03*fi*0.2);
  can=min(can,length(w-cc)-0.12-0.02*sin(uT+fi));}
 can+=(fbm3(w*9.+uT*0.1)-0.5)*0.08;
 vec3 bc=night?vec3(0.72,0.45,0.66):vec3(1.,0.72,0.8);
 bc*=0.85+0.3*fbm3(w*14.);
 draw(c,det,can,bc,0.5,aa);
 if(night){
  for(int i=0;i<4;i++){float fi=float(i);
   vec2 lp=vec2(-0.55+fi*0.15,0.07+0.03*sin(fi*2.))+vec2(0.005*sin(uT*1.5+fi),0.);
   draw(c,det,sdSeg(w,lp,lp+vec2(0.,0.06))-0.001,vec3(0.2),0.5,aa);
   float ld=sdEll(w-lp,vec2(0.018,0.024));
   draw(c,det,ld,vec3(1.,0.55,0.2)*(1.1+0.8*uBeat),1.,aa);
   c+=vec3(1.,0.5,0.2)*0.12*(1.+uBeat)*exp(-length(w-lp)*18.);}
 }
 vec2 hw;drawFigure(c,det,w,vec2(0.14,-0.305),0.3,1.,1.,night?vec3(0.1,0.08,0.18):vec3(0.2,0.14,0.26),night?vec3(1.,0.6,0.35):vec3(1.,0.9,0.75),aa,hw);
 float n=12.+28.*uEnergy;
 for(int i=0;i<40;i++){float fi=float(i);if(fi>n)break;
  vec2 h=vec2(hash11(fi*1.3),hash11(fi*7.1));
  vec2 pp=vec2(fract(h.x-uT*(0.03+0.04*h.y)*(0.6+uEnergy))*1.9-0.95,fract(h.y-uT*(0.05+0.03*h.x))*1.1-0.55);
  pp.x+=0.04*sin(uT*1.3+fi);

  draw(c,det,sdEll(q,vec2(0.011,0.006)),night?vec3(1.,0.7,0.85):vec3(1.,0.85,0.9),0.8,aa);}

/* ---------------- 3 · NIGHT SEA — rowing under the moon ---------------- */
vec4 nightSea(vec2 p){
 float sp=uSP;vec2 cam=vec2(mix(-0.12,0.12,sp),0.)+uCam.xy;float z=uCam.z;
 vec2 w=p*z+cam;float aa=1.5*z/uRes.y;float det=0.;
 vec3 c=mix(vec3(0.1,0.13,0.36),vec3(0.015,0.02,0.09),smoothstep(-0.05,0.5,p.y));
 c+=vec3(0.85,0.9,1.)*stars(p,70.,1.+2.*uHigh);
 vec2 mp=vec2(0.36,0.25)-cam*0.05;
 float md=length(p-mp);
 c+=vec3(0.6,0.7,1.)*(0.18+0.25*uMid)*exp(-md*6.);
 draw(c,det,md-0.05,vec3(1.,0.97,0.88),0.4,aa);
 float hor=-0.04;
 if(p.y<hor){
  float dep=hor-p.y;
  vec2 ww=vec2(w.x,p.y);
  vec3 sea=mix(vec3(0.1,0.16,0.42),vec3(0.03,0.05,0.18),sat(dep*2.5));
  float wl=waves(vec2(ww.x/(0.3+dep*3.),dep*30.),uT)*0.5+0.5;
  float band=smoothstep(0.55,0.95,sin(dep*260./(0.4+dep*4.)+wl*3.));
  sea+=vec3(0.2,0.3,0.6)*band*0.35*(1.-sat(dep*2.));
  float glit=pow(noise(vec2(w.x*60./(0.3+dep*3.),dep*400.-uT*3.)),6.)*exp(-abs(p.x-mp.x)*7.*(0.6+dep*2.));
  sea+=vec3(1.,0.95,0.8)*glit*(1.2+2.*uHigh);
  c=sea;det=0.05;
 }
 float bx=mix(-0.25,0.25,sp);float by=-0.12+0.008*sin(uT*1.5);
 vec2 bq=rot(0.04*sin(uT*1.2))*(w-vec2(bx,by));
 float hull=sdTrap(vec2(bq.x,-bq.y+0.0),0.075,0.13,0.022);
 hull=smin(hull,sdSeg(bq,vec2(0.13,0.02),vec2(0.16,0.045))-0.008,0.01);
 draw(c,det,hull,vec3(0.3,0.16,0.1),0.8,aa);
 vec2 lp=vec2(-0.1,0.07);
 draw(c,det,sdSeg(bq,vec2(-0.1,0.02),lp)-0.002,vec3(0.2),0.7,aa);
 float lg=sdCircle(bq-lp,0.012);
 draw(c,det,lg,vec3(1.,0.7,0.3)*(1.3+0.6*uBeat),1.,aa);
 c+=vec3(1.,0.6,0.25)*0.18*(1.+uBeat)*exp(-length(bq-lp)*14.);
 if(p.y<hor) c+=vec3(1.,0.6,0.25)*0.25*exp(-abs(w.x-bx+0.1)*60.)*exp(-(hor-p.y)*6.)*(0.6+0.4*sin(p.y*200.+uT*4.));
 vec2 hw;vec2 fpos=vec2(bx,by)+rot(-0.04*sin(uT*1.2))*vec2(0.01,0.018);
 drawFigure(c,det,w,fpos,0.17,1.,2.,vec3(0.08,0.08,0.16),vec3(0.9,0.75,0.6),aa,hw);
 draw(c,det,sdSeg(w,hw,hw+vec2(0.09,-0.1))-0.0025,vec3(0.35,0.22,0.12),0.8,aa);
 return vec4(c,det);}

/* ---------------- 4 · STARFIELD — floating among constellations ---------------- */
vec4 starfield(vec2 p){
 float sp=uSP;vec2 cam=vec2(0.,mix(-0.04,0.04,sp))+uCam.xy;float z=uCam.z*mix(1.05,0.9,sp);
 vec2 w=p*z+cam;float aa=1.5*z/uRes.y;float det=0.;
 float n1=fbm(w*1.6+vec2(uT*0.02,0.));float n2=fbm(w*2.8-vec2(0.,uT*0.015)+n1*1.5);
 vec3 c=mix(vec3(0.03,0.02,0.1),vec3(0.36,0.12,0.46),n1);
 c+=vec3(0.06,0.4,0.45)*pow(n2,2.2)*1.3+vec3(0.9,0.3,0.5)*pow(n1*n2,3.)*1.5*(1.+uBass);
 c+=vec3(1.)*stars(w,55.,1.+2.*uHigh)+vec3(0.8,0.85,1.)*stars(w*1.7+3.,40.,1.)*0.6;
 vec2 A[7]=vec2[7](vec2(-0.62,0.28),vec2(-0.45,0.1),vec2(-0.25,0.32),vec2(0.,0.2),vec2(0.22,0.36),vec2(0.45,0.15),vec2(0.64,0.3));
 for(int i=0;i<6;i++){float f=sat(uLP*6.-float(i));
  if(f>0.){vec2 b=mix(A[i],A[i+1],f);
   float ld=sdSeg(w,A[i],b);
   c+=vec3(1.,0.85,0.5)*(0.8*exp(-ld*700.)+0.15*exp(-ld*80.));det=max(det,exp(-ld*300.));}}
 for(int i=0;i<7;i++){float on=step(float(i)*0.1666,uLP+0.01);
  float sd=length(w-A[i]);c+=vec3(1.,0.9,0.7)*(on*1.5+0.3)*exp(-sd*120.)*(1.+uBeat);}
 vec2 pos=vec2(0.,-0.28+0.02*sin(uT*0.7));
 vec2 fw=pos+rot(0.25*sin(uT*0.35))*(w-pos);
 c+=vec3(0.8,0.6,1.)*0.25*(0.5+uBeat)*exp(-length(w-pos-vec2(0.,0.15))*5.);
 vec2 hw;drawFigure(c,det,fw,pos,0.34,1.,3.,vec3(0.1,0.07,0.2),vec3(0.8,0.7,1.),aa,hw);
 return vec4(c,det);}

/* ---------------- 5 · SUNRISE SEA — the finale ---------------- */
vec4 sunrise(vec2 p){
 float sp=uSP;vec2 cam=vec2(mix(0.1,-0.05,sp),mix(-0.03,0.03,sp))+uCam.xy;float z=uCam.z;
 vec2 w=p*z+cam;float aa=1.5*z/uRes.y;float det=0.;
 vec3 c=mix(vec3(1.,0.58,0.32),vec3(0.36,0.48,0.82),smoothstep(-0.05,0.5,p.y));
 vec2 sun=vec2(0.05,mix(-0.14,0.13,sp));float sd=length(p-sun);
 c+=vec3(1.,0.7,0.35)*(0.3+0.6*uBass)*exp(-sd*4.);
 draw(c,det,sd-0.075,vec3(1.,0.93,0.7),0.4,aa);
 float cl=fbm((p*z+cam*0.2)*vec2(2.,7.)+vec2(uT*0.01,0.));
 c=mix(c,vec3(1.,0.72,0.6),smoothstep(0.55,0.72,cl)*smoothstep(0.02,0.3,p.y)*0.8);
 float hor=-0.04;
 if(p.y<hor){
  float dep=hor-p.y;
  vec3 sea=mix(vec3(0.95,0.55,0.35),vec3(0.22,0.25,0.5),sat(dep*2.2));
  float wl=waves(vec2(w.x/(0.3+dep*3.),dep*30.),uT)*0.5+0.5;
  sea+=vec3(0.3,0.25,0.2)*smoothstep(0.6,0.95,sin(dep*240./(0.4+dep*4.)+wl*3.))*0.3;
  float col=exp(-abs(p.x-sun.x)*(5.+dep*8.))*sat(1.-dep*1.4);
  sea+=vec3(1.,0.85,0.5)*col*(0.5+pow(noise(vec2(w.x*50.,dep*300.-uT*3.)),3.)*1.8)*(0.8+0.6*uBass);
  c=sea;det=0.05;
 }
 float bx=mix(-0.35,-0.15,sp);float by=-0.13+0.008*sin(uT*1.5);
 vec2 bq=rot(0.04*sin(uT*1.2))*(w-vec2(bx,by));
 float hull=sdTrap(vec2(bq.x,-bq.y),0.075,0.13,0.022);
 draw(c,det,hull,vec3(0.3,0.15,0.1),0.8,aa);
 vec2 hw;drawFigure(c,det,w,vec2(bx,by+0.02),0.19,1.,1.,vec3(0.2,0.1,0.18),vec3(1.,0.8,0.5),aa,hw);
 for(int i=0;i<4;i++){float fi=float(i);
  vec2 bp=vec2(mod(uT*0.06+fi*0.23,1.8)-0.9,0.12+0.06*fi+0.02*sin(uT+fi));
  vec2 q=p-bp;float fl=sin(uT*8.+fi*2.)*0.5;
  draw(c,det,min(sdSeg(q,vec2(0.),vec2(-0.022,0.014*fl+0.01)),sdSeg(q,vec2(0.),vec2(0.022,0.014*fl+0.01)))-0.002,vec3(0.25,0.14,0.18),0.5,aa);}
 for(int i=0;i<14;i++){float fi=float(i);
  vec2 pp=vec2(fract(hash11(fi)-uT*0.03)*1.9-0.95,fract(hash11(fi*5.)-uT*0.04)*1.1-0.55);
  vec2 q=rot(uT*2.+fi)*(p-pp);
  draw(c,det,sdEll(q,vec2(0.01,0.005)),vec3(1.,0.8,0.85),0.8,aa);}
 return vec4(c,det);}

void main(){
 vec2 p=(gl_FragCoord.xy-0.5*uRes)/uRes.y;
 vec4 r;
 if(uScene<0.5) r=meadow(p);
 else if(uScene<1.5) r=kiteHill(p);
 else if(uScene<2.5) r=blossom(p);
 else if(uScene<3.5) r=nightSea(p);
 else if(uScene<4.5) r=starfield(p);
 else r=sunrise(p);
 o=vec4(max(r.rgb,0.),r.a);
}`;

/* ======================== PAINTER SHADERS ======================== */
const WIPE=`
uniform sampler2D uA,uB;uniform float uMix,uSeed;
float wipe(vec2 uv){
 if(uMix<=0.) return 0.; if(uMix>=1.) return 1.;
 float row=floor(uv.y*7.+hash11(uSeed)*3.);
 float x=mix(uv.x,1.-uv.x,step(0.5,hash11(uSeed*1.7)));
 float edge=x*0.8+hash11(row+uSeed*13.)*0.2+0.05*noise(vec2(uv.y*70.,row));
 return smoothstep(edge-0.02,edge+0.02,uMix*1.25-0.12);}
vec4 scn(vec2 uv){vec4 a=texture(uA,uv);if(uMix<=0.)return a;vec4 b=texture(uB,uv);return mix(a,b,wipe(uv));}
float lum(vec4 c){return dot(c.rgb,vec3(.3,.59,.11));}
`;
const VS=`#version 300 es
void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));gl_Position=vec4(p*2.-1.,0.,1.);}`;
const FS_FLOW=`#version 300 es
precision highp float;
uniform vec2 uOut,uRes;uniform float uFlow;out vec4 o;
${GLSL_COMMON}
${WIPE}
void main(){
 vec2 uv=gl_FragCoord.xy/uOut;
 vec2 e=vec2(1.5/uOut.x,0.),f=vec2(0.,1.5/uOut.y);
 float gx=lum(scn(uv+e))-lum(scn(uv-e)),gy=lum(scn(uv+f))-lum(scn(uv-f));
 float gm=length(vec2(gx,gy));
 float an=fbm3(uv*vec2(uRes.x/uRes.y,1.)*2.2+vec2(uFlow*0.06,-uFlow*0.04))*6.2831*0.75+0.3;
 float ae=atan(gy,gx)+1.5708;
 float k=smoothstep(0.02,0.12,gm);
 vec2 v=mix(vec2(cos(2.*an),sin(2.*an)),vec2(cos(2.*ae),sin(2.*ae)),k);
 o=vec4(v,gm,1.);}`;
const FS_PAINT=`#version 300 es
precision highp float;
uniform sampler2D uFlowT,uText;
uniform vec2 uRes;uniform float uT,uBeat,uEnergy,uBass,uHigh,uTextRev,uTextA,uFade,uDetail;
out vec4 o;
${GLSL_COMMON}
${WIPE}
void main(){
 vec2 px=gl_FragCoord.xy;vec2 uv=px/uRes;
 float u=uRes.y/1080.;
 vec3 col=(scn(uv+vec2(0.004,0.)).rgb+scn(uv-vec2(0.003,0.005)).rgb+scn(uv).rgb)/3.;
 float topV=0.,topBr=0.5,topA=0.;
 for(int L=0;L<3;L++){
  float fl=float(L);
  float cs=(L==0?30.:(L==1?16.:8.5))*u*(L==0?(1.3-0.35*uEnergy):1.);
  vec2 id0=floor(px/cs);
  float z1=-1.,z2=-1.,a1=0.,a2=0.,v1=0.,b1=0.5;vec3 c1=vec3(0),c2=vec3(0);
  for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){
   vec2 id=id0+vec2(i,j);
   vec2 h=hash22(id+fl*37.1);
   vec2 cpx=(id+0.15+0.7*h)*cs;
   vec2 cuv=cpx/uRes;
   vec4 fv=texture(uFlowT,cuv);
   vec4 s=scn(cuv);
   if(L==1&&s.a+fv.z*4.+h.y*0.4<0.35*uDetail) continue;
   if(L==2&&s.a+fv.z*5.+h.y*0.2<0.62*uDetail) continue;
   float ang=0.5*atan(fv.y,fv.x)+(h.x-0.5)*0.35;
   vec2 dv=vec2(cos(ang),sin(ang));
   cpx+=dv*cs*0.3*uBeat*(h.y-0.5);
   vec2 q=px-cpx;q=vec2(dot(q,dv),dot(q,vec2(-dv.y,dv.x)));
   float len=cs*(0.95+0.55*h.y)*(1.+0.2*uBeat),wid=cs*(0.36+0.12*h.x);
   float uu=q.x/len;q.y+=sin(uu*2.5+h.x*6.)*wid*0.22;
   float vv=q.y/(wid*(1.-0.3*uu*uu));
   float shape=1.-smoothstep(0.72,1.,length(vec2(uu,vv)));
   float br=noise(vec2(vv*6.5+h.x*30.,uu*1.3+h.y*9.));
   float a=shape*smoothstep(0.2,0.45,br+0.45-abs(uu)*0.35);
   if(a<=0.01) continue;
   float z=hash21(id*1.13+fl*5.3);
   vec3 sc=s.rgb*(0.9+0.2*br);
   if(z>z1){z2=z1;c2=c1;a2=a1;z1=z;c1=sc;a1=a;v1=vv;b1=br;}
   else if(z>z2){z2=z;c2=sc;a2=a;}
  }
  col=mix(col,c2,a2);col=mix(col,c1,a1);
  if(a1>0.3){topV=v1;topBr=b1;topA=a1;}
 }
 float ridge=(1.-abs(topV))*topA;
 col*=0.9+0.12*ridge+0.1*(topBr-0.5);
 col+=vec3(1.,0.95,0.85)*pow(sat(1.-abs(topV+0.4)*3.),3.)*0.07*topA;
 float weave=sin(px.x*1.25/u)*sin(px.y*1.25/u)*0.5+0.5;
 col*=0.95+0.05*weave+0.05*(noise(px*0.25/u)-0.5);
 vec2 tc=vec2(0.5,0.21)*uRes;float bw=min(uRes.x*0.94,uRes.y*2.4);float bh=bw/8.;
 vec2 tuv=(px-tc)/vec2(bw,bh)+0.5;
 if(uTextA>0.001&&tuv.x>0.&&tuv.x<1.&&tuv.y>0.&&tuv.y<1.){
  vec2 wob=vec2(noise(px*0.05)-0.5,noise(px*0.05+9.)-0.5)*vec2(0.002,0.015);
  float ta=texture(uText,tuv+wob).a;
  float halo=0.;
  for(int k=0;k<8;k++){float an=float(k)*0.785;halo=max(halo,texture(uText,tuv+vec2(cos(an)*0.005,sin(an)*0.04)).a);}
  float rev=smoothstep(tuv.x-0.03,tuv.x+0.01,uTextRev*1.1-0.05*noise(vec2(tuv.y*20.,uT)));
  float br2=noise(vec2(px.x*0.03,px.y*0.5));
  col=mix(col,col*0.3,halo*0.55*rev*uTextA);
  col=mix(col,vec3(1.,0.96,0.86)*(0.88+0.18*br2),ta*rev*uTextA);
 }
 col*=1.+0.1*uBeat*(0.3+uEnergy);
 vec2 vc=uv-0.5;col*=1.-0.35*dot(vc,vc)*1.6;
 o=vec4(pow(max(col,0.),vec3(0.95))*uFade,1.);}`;

const cv=$('gl');
const gl=cv.getContext('webgl2',{antialias:false,alpha:false,preserveDrawingBuffer:Q.has('still')});
const floatOK=gl&&!!gl.getExtension('EXT_color_buffer_float');
const vao=gl&&gl.createVertexArray();
function prog(fs,name){
  const mk=(t,s)=>{const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);
    if(!gl.getShaderParameter(x,gl.COMPILE_STATUS)) throw new Error(name+': '+gl.getShaderInfoLog(x));return x;};
  const p=gl.createProgram();gl.attachShader(p,mk(gl.VERTEX_SHADER,VS));gl.attachShader(p,mk(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(name+': '+gl.getProgramInfoLog(p));
  const u={};const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){const a=gl.getActiveUniform(p,i);u[a.name]=gl.getUniformLocation(p,a.name);}
  return {p,u};
}
function target(w,h){
  const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,floatOK?gl.RGBA16F:gl.RGBA8,w,h,0,gl.RGBA,floatOK?gl.HALF_FLOAT:gl.UNSIGNED_BYTE,null);
  for(const [k,v] of [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D,k,v);
  const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
  return {t,f,w,h};
}
const drawFS=()=>{gl.bindVertexArray(vao);gl.drawArrays(gl.TRIANGLES,0,3);};
function bindTex(pr,name,unit,tex){gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,tex);gl.uniform1i(pr.u[name],unit);}

function fftFactory(N){

/* ========================= LYRICIST AGENT ========================= */
function parseLyrics(text,duration,grid){
  const lines=[];const re=/\[(\d+):(\d+(?:\.\d+)?)\]/g;
  for(const raw of text.split(/\r?\n/)){
    const stamps=[...raw.matchAll(re)];const txt=raw.replace(re,'').trim();
    for(const m of stamps) lines.push({t:+m[1]*60+ +m[2],text:txt});
  }
  if(lines.length){lines.sort((a,b)=>a.t-b.t);}
  else { // plain text: spread lines over 2-bar slots after a short intro
    const ls=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    const bar=grid.period*4,start=grid.offset+bar*Math.max(2,Math.round(duration*0.06/bar));
    const slot=Math.max(bar,Math.floor((duration-start-bar*2)/Math.max(1,ls.length)/bar)*bar);
    ls.forEach((s,i)=>lines.push({t:start+i*slot,text:s}));
  }
  for(let i=0;i<lines.length;i++){const nx=lines[i+1]?lines[i+1].t:duration;lines[i].end=Math.min(nx,lines[i].t+12);}
  return lines.filter(l=>l.text);
}
function lyricAt(t){const L=W.lyrics;for(let i=L.length-1;i>=0;i--){if(t>=L[i].t) return t<L[i].end?{i,line:L[i]}:null;}return null;}

/* ========================= DIRECTOR AGENT ========================= */
const SCENE_NAMES=['Meadow at dawn','Kite hill','Blossom dance','Night sea','Starfield','Sunrise sea'];
function makePlan(A,hints){
  const segs=[];
  if(hints){
    SECTIONS.forEach(([name,b0,nb],i)=>segs.push({t0:b0*BAR,t1:(b0+nb)*BAR,name,scene:SCENE_OF[i][0],variant:SCENE_OF[i][1],energy:name==='chorus'?1:(name==='pre'||name==='bridge'?0.6:0.3)}));
  } else {
    const bar=A.period*4,first=A.offset+A.downPhase*A.period;
    const blk=A.duration>100?8:4;const bounds=[0];
    for(let t=first+bar*blk;t<A.duration-bar*2;t+=bar*blk) bounds.push(t);bounds.push(A.duration);
    const en=[];for(let i=0;i<bounds.length-1;i++){let s=0,c=0;for(let t=bounds[i];t<bounds[i+1];t+=0.1){s+=bandAt(A,A.low,t)*0.6+bandAt(A,A.mid,t)*0.4;c++;}en.push(s/c);}
    const sorted=[...en].sort((a,b)=>a-b),q=v=>sorted.indexOf(v)/Math.max(1,sorted.length-1);
    const LOW=[0,3,4],MID=[1,0,3],HIGH=[2,5,2];let last=-1;
    for(let i=0;i<en.length;i++){const lv=q(en[i]);let pool=lv>0.66?HIGH:(lv>0.33?MID:LOW);
      let sc=pool[(i*7+3)%pool.length];if(sc===last)sc=pool[(i*7+4)%pool.length];
      if(i===0)sc=0;if(i===en.length-1)sc=5;
      segs.push({t0:bounds[i],t1:bounds[i+1],name:lv>0.66?'peak':(lv>0.33?'build':'calm'),scene:sc,variant:(i%3===2)?1:0,energy:lv});last=sc;}
  }
  segs.forEach((s,i)=>{s.seed=i*1.37+0.3;s.drift=[(Math.sin(i*2.1)*0.06),(Math.cos(i*1.7)*0.03)];s.zoom=1+0.06*Math.sin(i*1.3);});

function directorState(t){
  const P=W.plan;let i=P.segs.findIndex(s=>t>=s.t0&&t<s.t1);if(i<0)i=t<P.segs[0].t0?0:P.segs.length-1;
  const s=P.segs[i],sp=Math.min(1,Math.max(0,(t-s.t0)/(s.t1-s.t0)));
  const prev=P.segs[i-1];const tp=(t-s.t0)/P.trans;
  const inTrans=prev&&tp<1&&(prev.scene!==s.scene||prev.variant!==s.variant);
  return {i,s,sp,prev,mix:inTrans?smooth(tp):1,inTrans};

function smooth(u){u=Math.min(1,Math.max(0,u));return u*u*(3-2*u);}

/* ========================= PLAYER ========================= */
const P={ctx:null,src:null,gain:null,an:null,startAt:0,offset:0,playing:false,freq:null,wave:null};

  if(P.ctx) return;
  P.ctx=new (window.AudioContext||window.webkitAudioContext)();
  P.gain=P.ctx.createGain();P.gain.gain.value=$('vol').value/100;
  P.an=P.ctx.createAnalyser();P.an.fftSize=2048;P.an.smoothingTimeConstant=0.72;
  const lim=P.ctx.createDynamicsCompressor();lim.threshold.value=-3;lim.ratio.value=12;lim.attack.value=0.003;lim.release.value=0.15;
  P.gain.connect(lim);lim.connect(P.an);P.an.connect(P.ctx.destination);
  P.freq=new Uint8Array(P.an.frequencyBinCount);P.wave=new Uint8Array(P.an.fftSize);P.prevF=new Float32Array(P.an.frequencyBinCount);
}
function now(){ if(!P.ctx||!P.playing) return P.offset; return Math.min(W.dur,P.ctx.currentTime-P.startAt); }
function play(){ if(!W.buffer) return; ensureCtx(); P.ctx.resume();
  if(P.offset>=W.dur-0.05) P.offset=0;
  P.src=P.ctx.createBufferSource();P.src.buffer=W.buffer;P.src.connect(P.gain);
  P.startAt=P.ctx.currentTime-P.offset;P.src.start(0,P.offset);P.playing=true;
  P.src.onended=()=>{ if(P.playing&&now()>=W.dur-0.1){P.playing=false;P.offset=W.dur;$('play').textContent='▶';} };
  $('play').textContent='❚❚';}
function pause(){ if(!P.playing) return; P.offset=now(); P.playing=false; try{P.src.stop();}catch(e){} $('play').textContent='▶'; }
function seek(t){ const was=P.playing; if(was) pause(); P.offset=Math.max(0,Math.min(W.dur,t)); if(was) play(); }

/* ========================= RENDER LOOP (Scene + Painter agents) ========================= */
let PR={},RT={},Wd=0,Hd=0,scale=1,ema=16.7,lastNow=0,lastAdj=0,flowAcc=0,lastT=0,calm=0;

function layout(){

  const w=Math.round(innerWidth*dpr),h=Math.round(innerHeight*dpr);
  if(w!==Wd||h!==Hd){Wd=w;Hd=h;cv.width=w;cv.height=h;buildRT();}
}
function buildRT(){

  const pw=Math.round(Wd*scale),ph=Math.round(Hd*scale);
  RT.a=target(Math.max(8,pw>>1),Math.max(8,ph>>1));RT.b=target(Math.max(8,pw>>1),Math.max(8,ph>>1));
  RT.flow=target(Math.max(8,pw>>2),Math.max(8,ph>>2));RT.paint=target(pw,ph);
}
function drawLyricTex(line){
  tctx.clearRect(0,0,2048,256);
  if(line){ let size=112;tctx.font=`italic ${size}px Georgia, "Times New Roman", serif`;
    while(tctx.measureText(line).width>1960&&size>40){size-=6;tctx.font=`italic ${size}px Georgia, "Times New Roman", serif`;}

}
function listenLive(t){
  const L=W.live,A=W.analysis;
  let bass=A?bandAt(A,A.low,t):0,mid=A?bandAt(A,A.mid,t):0,high=A?bandAt(A,A.high,t):0,onset=0;
  if(P.an&&P.playing){
    P.an.getByteFrequencyData(P.freq);P.an.getByteTimeDomainData(P.wave);
    const sr=P.ctx.sampleRate,bin=sr/P.an.fftSize;let lo=0,mi=0,hi=0,nl=0,nm=0,nh=0,fl=0;
    for(let k=1;k<P.freq.length;k++){const v=P.freq[k]/255,f=k*bin;const d=v-P.prevF[k];if(d>0)fl+=d;P.prevF[k]=v;
      if(f<150){lo+=v;nl++;}else if(f<2000){mi+=v;nm++;}else if(f<12000){hi+=v;nh++;}}
    bass=bass*0.4+Math.min(1,lo/nl*1.3)*0.6;mid=mid*0.4+Math.min(1,mi/nm*1.8)*0.6;high=high*0.4+Math.min(1,hi/nh*3)*0.6;

function renderFrame(t){

  const segE=D.s.energy;
  const camFor=(s,sp)=>[s.drift[0]*(sp-0.5)*2,s.drift[1]*(sp-0.5)*2,s.zoom*(1-0.035*W.downPulse*(segE>0.8?1:0.3))];
  const drawScene=(rt,s,sp)=>{gl.bindFramebuffer(gl.FRAMEBUFFER,rt.f);gl.viewport(0,0,rt.w,rt.h);const S=PR.scene;gl.useProgram(S.p);
    const c=camFor(s,sp);gl.uniform2f(S.u.uRes,rt.w,rt.h);gl.uniform1f(S.u.uT,t);gl.uniform1f(S.u.uSP,sp);gl.uniform1f(S.u.uScene,s.scene);gl.uniform1f(S.u.uVar,s.variant);
    gl.uniform1f(S.u.uBass,L.bass);gl.uniform1f(S.u.uMid,L.mid);gl.uniform1f(S.u.uHigh,L.high);gl.uniform1f(S.u.uEnergy,Math.max(L.energy,segE*0.7));
    gl.uniform1f(S.u.uBeat,W.beatPulse);gl.uniform1f(S.u.uBeatCount,W.beatCount);
    const ly=lyricAt(t);gl.uniform1f(S.u.uLP,ly&&s.scene===4?Math.min(1,(t-s.t0)/(s.t1-s.t0)*1.15):sp);

  if(D.inTrans){drawScene(RT.a,D.prev,1);drawScene(RT.b,D.s,D.sp);}else drawScene(RT.a,D.s,D.sp);
  const mix=D.inTrans?D.mix:0,seed=D.s.seed;
  const setWipe=pr=>{bindTex(pr,'uA',0,RT.a.t);bindTex(pr,'uB',1,D.inTrans?RT.b.t:RT.a.t);gl.uniform1f(pr.u.uMix,mix);gl.uniform1f(pr.u.uSeed,seed);};

const fmt=s=>{s=Math.max(0,s);return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');};
/* ---- live wave spectrum ---- */
const sp=$('spec'),sctx=sp.getContext('2d');
function spectrum(){

  const n=48,bins=P.freq.length;

setInterval(()=>{if(started&&P.playing&&performance.now()-idleT>3500){$('bar').style.opacity=0.0;$('hud').style.opacity=0.0;}},500);
addEventListener('dragover',e=>{e.preventDefault();$('drop').style.display='block';});
addEventListener('dragleave',()=>{$('drop').style.display='none';});
addEventListener('drop',e=>{e.preventDefault();$('drop').style.display='none';
  const fs=[...e.dataTransfer.files];const ly=fs.find(f=>/\.(lrc|txt)$/i.test(f.name));const au=fs.find(f=>f.type.startsWith('audio'));
  (async()=>{if(ly)await readLyrics(ly);if(au)startFile(au);})();});

try{
  if(!gl) throw new Error('WebGL2 is required.');
  initGL();
  if(Q.has('still')){ // debug: render one frame of the demo plan at ?still=SECONDS (no audio)
    const t=+Q.get('still');W.hints=true;W.dur=60*BAR;
    W.analysis={dt:0.05,low:[0.5],mid:[0.4],high:[0.3],flux:[0],bpm:BPM,period:BEAT,offset:0,downPhase:0,duration:W.dur};
    W.plan=makePlan(W.analysis,true);W.lyrics=parseLyrics(demoLRC(),W.dur,W.analysis);
    $('start').style.display='none';$('bar').classList.remove('hide');
    lastT=t-0.016;flowAcc=t*1.2;renderFrame(t);document.title='READY';
  }
}catch(e){status('error: '+e.message);document.title='ERROR '+e.message;console.error(e);}
if(Q.has('prof')){ (async()=>{const t0=performance.now();await composeDemo();document.title='PROF '+((performance.now()-t0)/1000).toFixed(1)+'s skip='+(Q.get('skip')||'');})(); }
if(Q.has('autodemo')){ // debug: start the demo without a click and report agent state in the title
  setTimeout(startDemo,50);
  setInterval(()=>{ if(W.analysis) document.title='LIVE t='+now().toFixed(1)+' bpm='+W.analysis.bpm.toFixed(2)+' off='+W.analysis.offset.toFixed(3)+' down='+W.analysis.downPhase+' ema='+ema.toFixed(1)+' scale='+scale.toFixed(2)+' bass='+W.live.bass.toFixed(2)+' playing='+P.playing+' seg='+(W.plan?directorState(now()).i+'/'+W.plan.segs.length+':'+SCENE_NAMES[directorState(now()).s.scene]:'')+' lyr='+(lyricAt(now())?lyricAt(now()).line.text.slice(0,18):'-'); else document.title='WAIT '+$('status').textContent+' '+$('prog').firstElementChild.style.width; },1000);
}
</script>
</body>
</html>
