<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>水墨 · 七幕</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#171009;overflow:hidden;}
  canvas{display:block;position:absolute;top:0;left:0;}
  #startOverlay{
    position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:0 16px;
    background:radial-gradient(ellipse at 50% 40%, #241a10 0%, #100b06 100%);
    color:#e9dcbd;font-family:"Noto Serif SC","STKaiti","KaiTi","SimSun",serif;
    cursor:pointer; transition:opacity .8s ease;
  }
  #startOverlay h1{font-size:clamp(30px,6vw,46px);letter-spacing:14px;margin:0 0 10px 0;font-weight:400;text-shadow:0 0 22px rgba(233,220,180,.35);}
  #startOverlay p.sub{font-size:14px;letter-spacing:4px;color:#c8b98d;margin:4px 0 26px 0;opacity:.85;}
  #startOverlay .acts{font-size:13px;letter-spacing:3px;color:#a9976a;line-height:2;max-width:560px;opacity:.85;}
  #startOverlay .note{font-size:12px;letter-spacing:3px;color:#8a7b58;margin-top:16px;}
  #startOverlay .btn{
    margin-top:28px;padding:10px 34px;border:1px solid #cbb87f;border-radius:2px;
    font-size:15px;letter-spacing:6px;color:#f1e6c4;background:rgba(255,255,255,0.03);
  }
  #startOverlay .btn:hover{background:rgba(255,255,255,0.08);}
  #hud{
    position:absolute;left:16px;bottom:12px;z-index:5;pointer-events:none;
    font-family:"Noto Serif SC","STKaiti","KaiTi",serif;color:rgba(235,224,196,0.55);
    font-size:13px;letter-spacing:3px; text-shadow:0 1px 3px rgba(0,0,0,.5);
  }
  #actName{
    position:absolute;right:22px;top:18px;z-index:5;pointer-events:none;text-align:right;
    font-family:"STKaiti","KaiTi","Noto Serif SC",serif;color:rgba(60,48,32,0.8);
    font-size:24px;letter-spacing:8px;opacity:0;transition:opacity .8s ease;
    text-shadow:0 0 8px rgba(240,232,210,.8);
  }
  #actName.night{color:rgba(240,232,210,0.9);text-shadow:0 0 8px rgba(20,22,40,.9)}
  #actName small{display:block;font-size:12px;letter-spacing:5px;opacity:.75;margin-bottom:2px}
  #progressWrap{position:absolute;left:0;bottom:0;width:100%;height:3px;background:rgba(0,0,0,0.25);z-index:5;}
  #progressBar{height:100%;width:0%;background:linear-gradient(90deg,#7a2b22,#c9a24a);}
  #replayHint{
    position:absolute;left:0;right:0;bottom:26px;text-align:center;z-index:6;
    font-family:"Noto Serif SC","STKaiti","KaiTi",serif;color:rgba(60,48,32,0.0);
    font-size:14px;letter-spacing:4px;pointer-events:none;transition:color 1s ease;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="actName"></div>
<div id="hud">水墨 · 七幕　Ink-Wash · Seven Acts</div>
<div id="progressWrap"><div id="progressBar"></div></div>
<div id="replayHint">点 击 画 面　重 新 观 看</div>
<div id="startOverlay">
  <h1>水&nbsp;墨&nbsp;·&nbsp;七&nbsp;幕</h1>
  <p class="sub">A N   I N K - W A S H   J O U R N E Y   I N   S E V E N   A C T S</p>
  <div class="acts">落墨　·　群山　·　江河　·　人间　·　风暴　·　白鹤　·　归依</div>
  <div class="btn">点 击 开 始 ・ C L I C K   T O   B E G I N</div>
  <div class="note">全片约两分钟 · 请开启声音</div>
</div>

<script>
window.addEventListener('error', e=>{ document.title = 'ERROR: ' + e.message + ' @' + e.lineno; });
document.title = '水墨 · 七幕';

(function(){
"use strict";
const AUTOTEST = /autotest/.test(location.search);

/* ============================== canvas / viewport ============================== */
const canvas = document.getElementById('c');
let ctx = canvas.getContext('2d', {alpha:false});
const VW = 1600, VH = 900;
const DPR = Math.min(window.devicePixelRatio||1, 2);
let scaleFit = 1, offX = 0, offY = 0;

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  canvas.width = Math.round(w*DPR);
  canvas.height = Math.round(h*DPR);
  canvas.style.width = w+'px';
  canvas.style.height = h+'px';
  // cover the window (crop a little) rather than letterbox, so the paper fills the screen
  scaleFit = Math.max(w/VW, h/VH);
  if(w/h < 1.2) scaleFit = Math.min(scaleFit, h/VH*1.0);   // tall/narrow screens: keep the whole height
  offX = (w - VW*scaleFit)/2;
  offY = (h - VH*scaleFit)/2;
}
window.addEventListener('resize', resize);
resize();

function beginFrame(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#e9dfc0';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.setTransform(DPR*scaleFit,0,0,DPR*scaleFit, offX*DPR, offY*DPR);
}

/* ============================== math / noise utils ============================== */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function smoothstep(a,b,x){ x=clamp((x-a)/(b-a),0,1); return x*x*(3-2*x); }
function hash(n){ const s=Math.sin(n*12.9898+78.233)*43758.5453123; return s-Math.floor(s); }
function hash2(x,y){ const s=Math.sin(x*127.1+y*311.7)*43758.5453123; return s-Math.floor(s); }
function vnoise(x,y){
  const x0=Math.floor(x), y0=Math.floor(y), xf=x-x0, yf=y-y0;
  const h00=hash2(x0,y0), h10=hash2(x0+1,y0), h01=hash2(x0,y0+1), h11=hash2(x0+1,y0+1);
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  return h00*(1-u)*(1-v)+h10*u*(1-v)+h01*(1-u)*v+h11*u*v;
}
function fbm(x,y){
  let s=0, amp=0.6, freq=1, tot=0;
  for(let o=0;o<4;o++){ s+=vnoise(x*freq,y*freq)*amp; tot+=amp; amp*=0.5; freq*=2; }
  return s/tot;
}
function ramp(localT, dur, edge){
  edge = edge===undefined?1.6:edge;
  if(localT<0 || localT>dur) return 0;
  return Math.max(0, Math.min(smoothstep(0, edge, localT), 1 - smoothstep(dur-edge, dur, localT)));
}
// small deterministic PRNG so every run paints the same picture
function rng(seed){
  let s = seed>>>0 || 1;
  return ()=>{ s = (s + 0x6D2B79F5)>>>0; let t = s; t = Math.imul(t ^ t>>>15, t|1); t ^= t + Math.imul(t ^ t>>>7, t|61); return ((t ^ t>>>14)>>>0)/4294967296; };
}
const rgba = (c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
const PAPER = [238,229,204];
const INK = [24,22,26];

/* ============================== rice paper texture ============================== */
const paperCanvas = document.createElement('canvas');
paperCanvas.width = VW; paperCanvas.height = VH;
(function buildPaper(){
  const pctx = paperCanvas.getContext('2d');
  const R = rng(7);
  const grad = pctx.createLinearGradient(0,0,VW,VH);
  grad.addColorStop(0,'#f3ecd6'); grad.addColorStop(0.5,'#eee5c9'); grad.addColorStop(1,'#e9dfc0');
  pctx.fillStyle = grad; pctx.fillRect(0,0,VW,VH);
  for(let i=0;i<50;i++){
    const x=hash(i*3.1)*VW, y=hash(i*7.7+2)*VH, r=60+hash(i*5.3)*160;
    const g = pctx.createRadialGradient(x,y,0,x,y,r);
    const tone = hash(i*9.9)>0.5 ? '210,195,150' : '180,170,140';
    g.addColorStop(0, `rgba(${tone},${0.05+hash(i)*0.05})`);
    g.addColorStop(1, 'rgba(200,190,150,0)');
    pctx.fillStyle=g; pctx.beginPath(); pctx.arc(x,y,r,0,Math.PI*2); pctx.fill();
  }
  // long xuan-paper fibres
  for(let i=0;i<1400;i++){
    const x = R()*VW, y = R()*VH, len = 4+R()*18, ang = R()*Math.PI;
    const dx = Math.cos(ang)*len, dy=Math.sin(ang)*len;
    pctx.strokeStyle = `rgba(150,135,95,${0.03+R()*0.05})`;
    pctx.lineWidth = 0.6;
    pctx.beginPath(); pctx.moveTo(x-dx,y-dy); pctx.quadraticCurveTo(x+dy*0.2,y-dx*0.2,x+dx,y+dy); pctx.stroke();
  }
  for(let i=0;i<3000;i++){
    pctx.fillStyle = `rgba(120,105,75,${0.02+R()*0.05})`;
    pctx.fillRect(R()*VW,R()*VH,1,1);
  }
  const vg = pctx.createRadialGradient(VW/2,VH/2,VH*0.3,VW/2,VH/2,VW*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(60,45,25,0.14)');
  pctx.fillStyle=vg; pctx.fillRect(0,0,VW,VH);
})();

/* ============================== brushes ============================== */
function catmullRomPoints(pts, samples){
  if(pts.length<2) return pts.slice();
  if(pts.length===2){
    const res=[]; for(let s=0;s<=samples;s++){ const t=s/samples; res.push({x:lerp(pts[0].x,pts[1].x,t), y:lerp(pts[0].y,pts[1].y,t)}); } return res;
  }
  const res=[];
  const p=[pts[0], ...pts, pts[pts.length-1]];
  for(let i=0;i<pts.length-1;i++){
    const p0=p[i], p1=p[i+1], p2=p[i+2], p3=p[i+3];
    for(let s=0;s<samples;s++){
      const t=s/samples, t2=t*t, t3=t2*t;
      res.push({
        x:0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
        y:0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)
      });
    }
  }
  res.push(pts[pts.length-1]);
  return res;
}
// pressure profile along a stroke: quick press-in, sustained body, lifted tail
function pressure(u){ return 0.12 + 0.88*smoothstep(0,0.08,u)*(1-0.82*smoothstep(0.62,1,u)); }

/* Dry-brush stroke: a wet translucent core plus individual bristle tracks. Where the
   brush runs dry the bristles break up (飞白, "flying white"), more so toward the end.
   `grow` (0..1) paints only the first part, so strokes can be animated as they are laid down. */
function bristleStroke(ctx, rawPts, o){
  const grow = o.grow===undefined ? 1 : o.grow;
  if(grow <= 0.004) return;
  const pts = catmullRomPoints(rawPts, o.samples||10);
  const n = pts.length;
  const last = Math.max(2, Math.floor((n-1)*clamp(grow,0,1))+1);
  const width = o.width, col = o.color||INK, alpha = o.alpha===undefined?0.85:o.alpha;
  const dry = o.dry||0, seed = o.seed||1;
  const B = o.bristles || Math.max(4, Math.min(22, Math.round(width/1.6)));
  const nx = new Float32Array(n), ny = new Float32Array(n), w = new Float32Array(n);
  for(let i=0;i<n;i++){
    const prev=pts[Math.max(0,i-1)], next=pts[Math.min(n-1,i+1)];
    let ax=-(next.y-prev.y), ay=(next.x-prev.x);
    const l=Math.hypot(ax,ay)||1; nx[i]=ax/l; ny[i]=ay/l;
    w[i] = width*pressure(i/(n-1))*(o.flat ? 1 : 1);
  }
  // wet core
  if(o.core!==false){
    ctx.beginPath();
    for(let i=0;i<last;i++){ const hw=w[i]*0.42; const x=pts[i].x+nx[i]*hw, y=pts[i].y+ny[i]*hw; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
    for(let i=last-1;i>=0;i--){ const hw=w[i]*0.42; ctx.lineTo(pts[i].x-nx[i]*hw, pts[i].y-ny[i]*hw); }
    ctx.closePath();
    ctx.fillStyle = rgba(col, alpha*(o.coreAlpha||0.55));
    ctx.fill();
  }
  if(o.coreOnly) return;
  // bristles
  ctx.lineCap='round'; ctx.lineJoin='round';
  for(let b=0;b<B;b++){
    const off = (b/(B-1)-0.5)*0.95 + (hash(b*7.1+seed)-0.5)*0.06;
    const ba = alpha*(0.45+0.55*hash(b*3.3+seed*1.7));
    ctx.strokeStyle = rgba(col, ba);
    ctx.lineWidth = Math.max(0.6, width/B*(o.overlap||1.5));
    ctx.beginPath();
    let pen=false;
    for(let i=0;i<last;i++){
      const u=i/(n-1);
      if(dry>0){
        const edge = Math.abs(off)*2;               // outer bristles run dry first
        const v = vnoise(b*1.91+seed*3.7, i*0.21+seed);
        if(v < dry*(0.15+u*0.9+edge*0.35)){ pen=false; continue; }
      }
      const x=pts[i].x+nx[i]*off*w[i], y=pts[i].y+ny[i]*off*w[i];
      if(!pen){ ctx.moveTo(x,y); pen=true; } else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
}
function strokeLen(raw){ let L=0; for(let i=1;i<raw.length;i++) L+=Math.hypot(raw[i].x-raw[i-1].x, raw[i].y-raw[i-1].y); return L; }
function pointAlong(raw, f){
  const pts = catmullRomPoints(raw, 10);
  const i = clamp(f,0,1)*(pts.length-1), k=Math.floor(i), r=i-k;
  const a=pts[k], b=pts[Math.min(pts.length-1,k+1)];
  return {x:lerp(a.x,b.x,r), y:lerp(a.y,b.y,r), dx:b.x-a.x, dy:b.y-a.y};
}

/* ============================== ink diffusion grid ============================== */
class InkGrid{
  constructor(gw,gh,color){
    this.gw=gw; this.gh=gh;
    this.cur=new Float32Array(gw*gh); this.nxt=new Float32Array(gw*gh); this.dry=new Float32Array(gw*gh);
    this.bias=new Float32Array(gw*gh);
    // paper fibres make ink travel unevenly: a per-cell absorbency field
    for(let y=0;y<gh;y++)for(let x=0;x<gw;x++) this.bias[y*gw+x] = 0.55+fbm(x*0.06+gw, y*0.09)*0.9;
    this.small = document.createElement('canvas'); this.small.width=gw; this.small.height=gh;
    this.sctx = this.small.getContext('2d');
    this.imgData = this.sctx.createImageData(gw,gh);
    this.setColor(...(color||[16,15,19]));
  }
  setColor(r,g,b){ const d=this.imgData.data; for(let i=0;i<this.gw*this.gh;i++){ d[i*4]=r; d[i*4+1]=g; d[i*4+2]=b; } }
  reset(){ this.cur.fill(0); this.nxt.fill(0); this.dry.fill(0); }
  addDrop(nx,ny,amt,radX,radY){
    radY = radY===undefined ? radX : radY;
    const gw=this.gw, gh=this.gh, cx=nx*gw, cy=ny*gh;
    const x0=Math.max(0,Math.floor(cx-radX*1.7)), x1=Math.min(gw-1,Math.ceil(cx+radX*1.7));
    const y0=Math.max(0,Math.floor(cy-radY*1.7)), y1=Math.min(gh-1,Math.ceil(cy+radY*1.7));
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
      const dx=x-cx, dy=y-cy, g=Math.exp(-((dx*dx)/(radX*radX)+(dy*dy)/(radY*radY))/0.62);
      if(g>0.003){ const i=y*gw+x; this.cur[i]=Math.min(1.5,this.cur[i]+amt*g); }
    }
  }
  eraseRegion(nx,ny,radX,radY,strength){
    const gw=this.gw, gh=this.gh, cx=nx*gw, cy=ny*gh;
    const x0=Math.max(0,Math.floor(cx-radX*1.7)), x1=Math.min(gw-1,Math.ceil(cx+radX*1.7));
    const y0=Math.max(0,Math.floor(cy-radY*1.7)), y1=Math.min(gh-1,Math.ceil(cy+radY*1.7));
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
      const dx=x-cx, dy=y-cy, g=Math.exp(-((dx*dx)/(radX*radX)+(dy*dy)/(radY*radY))/0.62);
      const i=y*gw+x, f=Math.max(0,1-strength*g); this.cur[i]*=f; this.dry[i]*=f;
    }
  }
  // Explicit diffusion is stable only while diffRate*maxBias < ~0.25 (bias 0.55..1.45): keep rates <= 0.17.
  step(diffRate, decay, drySpeed){
    const gw=this.gw, gh=this.gh, cur=this.cur, nxt=this.nxt, bias=this.bias;
    for(let y=0;y<gh;y++){
      const rowUp=(y>0?y-1:y)*gw, rowDn=(y<gh-1?y+1:y)*gw, row=y*gw;
      for(let x=0;x<gw;x++){
        const i=row+x, xL=x>0?x-1:x, xR=x<gw-1?x+1:x;
        const lap=cur[row+xL]+cur[row+xR]+cur[rowUp+x]+cur[rowDn+x]-4*cur[i];
        let v=cur[i]+diffRate*bias[i]*lap-decay*cur[i];
        nxt[i]= v<0?0:(v>1.5?1.5:v);
      }
    }
    cur.set(nxt);
    const dry=this.dry;
    // pigment settles into the fibres: the dried layer keeps the bloom's darker tide-line
    for(let i=0;i<gw*gh;i++){ const target=cur[i]*drySpeed; if(target>dry[i]) dry[i]+=(target-dry[i])*0.16; else dry[i]*=0.9993; }
  }
  renderTo(ctx, vx,vy,vw,vh, visibility){
    if(visibility<=0.002) return;
    const n=this.gw*this.gh, cur=this.cur, dry=this.dry, data=this.imgData.data;
    for(let i=0;i<n;i++){
      const val=Math.min(1, cur[i]*0.62 + dry[i]*0.62);
      data[i*4+3]=val*255*visibility;
    }
    this.sctx.putImageData(this.imgData,0,0);
    ctx.save(); ctx.imageSmoothingEnabled=true;
    ctx.drawImage(this.small,0,0,this.gw,this.gh,vx,vy,vw,vh);
    ctx.restore();
  }
}
// deterministic, seekable simulation: replays scripted drops on a fixed 1/24 s step
const SIM_DT = 1/24;
function makeSim(grid, events, diff, decay, dryS){
  events.sort((a,b)=>a.t-b.t);
  let ptr=0, simT=0;
  return function ensure(target){
    if(target < simT-1e-6){ grid.reset(); simT=0; ptr=0; }
    let guard=0;
    while(simT < target-1e-6 && guard++ < 200000){
      const dt = Math.min(SIM_DT, target-simT);
      while(ptr<events.length && events[ptr].t <= simT+dt+1e-6){
        const e=events[ptr++];
        if(e.erase) grid.eraseRegion(e.gx,e.gy,e.radX,e.radY,e.strength);
        else grid.addDrop(e.gx,e.gy,e.amt,e.radX,e.radY);
      }
      grid.step(diff, decay, dryS);
      simT += dt;
    }
  };
}

/* ============================== timeline ============================== */
const ACTS = [
  {name:'落墨', no:'第一幕', start:0,   end:14},
  {name:'群山', no:'第二幕', start:14,  end:30},
  {name:'江河', no:'第三幕', start:30,  end:48},
  {name:'人间', no:'第四幕', start:48,  end:70},
  {name:'风暴', no:'第五幕', start:70,  end:88},
  {name:'白鹤', no:'第六幕', start:88,  end:102},
  {name:'归依', no:'第七幕', start:102, end:124},
];
const TOTAL = 124;
const actIndex = t => { for(let i=ACTS.length-1;i>=0;i--) if(t>=ACTS[i].start) return i; return 0; };

/* ============================== shared landscape ============================== */
function peakRidge(baseY, peaks, noiseAmp, seed, N){
  N = N||80;
  const pts=[];
  for(let i=0;i<=N;i++){
    const x = -20 + i/N*(VW+40);
    let h = 0;
    for(const pk of peaks){ const d=Math.abs(x-pk.x)/pk.w; h=Math.max(h, pk.h*Math.exp(-Math.pow(d,1.5))); }
    h += (fbm(x*0.008+seed, seed*1.3)-0.5)*noiseAmp*(0.5+h/260);
    pts.push({x, y: baseY-Math.max(8,h)});
  }
  return pts;
}
const FAR  = peakRidge(520, [{x:120,h:200,w:150},{x:470,h:300,w:120},{x:820,h:190,w:190},{x:1180,h:270,w:150},{x:1500,h:180,w:150}], 36, 1.3);
const MID  = peakRidge(615, [{x:60,h:200,w:140},{x:360,h:250,w:110},{x:640,h:330,w:95},{x:1010,h:200,w:130},{x:1330,h:300,w:110}], 44, 4.1);
const NEAR = peakRidge(712, [{x:-30,h:360,w:170},{x:240,h:200,w:110},{x:1300,h:180,w:110},{x:1570,h:390,w:160}], 52, 7.7);
const LAYERS = [
  {pts:FAR,  base:520, col:[150,158,170], a:0.42, rim:2.5, t0:15.5},
  {pts:MID,  base:615, col:[92,96,104],  a:0.62, rim:4,   t0:18.5},
  {pts:NEAR, base:712, col:[34,33,38],   a:0.82, rim:6,   t0:21.5},
];
function buildTexture(pts, count, seed, maxDepth){
  const R=rng(seed), out=[];
  for(let k=0;k<count*4 && out.length<count;k++){
    const i=2+Math.floor(R()*(pts.length-4)), p=pts[i];

function drawDrop(t){

function riverAt(u){

const BURSTS = [
  {t:55.5, x:300, y:300, c:[206,40,40]}, {t:57.5, x:1300, y:260, c:[214,150,30]}, {t:59.2, x:520, y:220, c:[214,150,30]},

/* ============================== Act 5: the storm ============================== */

const FLASHES=[73.5,78.2,82.6,86.0];
function drawLightning(t){
  for(const ft of FLASHES){
    const dl=t-ft;
    if(dl<0 || dl>0.45) continue;
    const fa=1-dl/0.45;
    ctx.save();
    ctx.globalAlpha=fa*0.5; ctx.fillStyle='rgba(236,238,248,1)'; ctx.fillRect(-200,-200,VW+400,VH+400);
    if(dl<0.28){
      const R=rng(Math.floor(ft*10));
      const bolt=(x,y,len,ang,w,depth)=>{
        let px=x, py=y;
        ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(px,py);
        const n=6+Math.floor(R()*4);
        for(let s=0;s<n;s++){
          px+=Math.sin(ang)*len/n+(R()-0.5)*34; py+=Math.cos(ang)*len/n;
          ctx.lineTo(px,py);
          if(depth<2 && R()<0.28){ ctx.stroke(); bolt(px,py,len*0.45,ang+(R()-0.5)*1.4,w*0.55,depth+1); ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(px,py); }
        }

}

/* ============================== Act 6: the crane ============================== */

  });

  ctx.fillStyle='rgba(206,58,40,0.92)'; ctx.beginPath(); ctx.arc(sx,sy,r*0.78,0,Math.PI*2); ctx.fill();

/* ============================== world, convergence, final dot ============================== */
function drawWorld(t){
  ensureInk(t);
  inkGrid.renderTo(ctx,0,0,VW,VH,1);
  drawDrop(t);
  const land = smoothstep(14,16,t);
  drawSunrise(t,1);
  drawDusk(t,1);
  drawLayer(LAYERS[0],t,land); drawMist(LAYERS[0].base,land,0.8);
  drawLayer(LAYERS[1],t,land); drawTexture(MID_TEX,20,t,land*0.85); drawMist(LAYERS[1].base,land,0.75);
  drawRiver(t,1);
  drawBridge(t,1);
  drawLayer(LAYERS[2],t,land); drawTexture(NEAR_TEX,23,t,land);
  for(const p of PINES) drawPine(p.x,p.y,p.s,land*smoothstep(25+p.t*3,26+p.t*3,t));
  drawMist(LAYERS[2].base+30,land,0.5);
  drawBoats(t,1);
  const night = t>=101;
  for(const h of HOUSES) drawHouse(h,t,1,night);
  drawBirds(t,1);
  drawFireworks(t,1);
  drawHeavens(t,1);
  drawStorm(t,1);
  drawLightning(t);
  drawCrane(t,1);
}
const CONV0=113, CONV1=122.5;
const wcanvas=document.createElement('canvas'); wcanvas.width=VW; wcanvas.height=VH;
const wctx=wcanvas.getContext('2d');

function drawTitle(t){

function drawSeal(x,y,size,chars,a){

  ctx.fill();
  ctx.fillStyle='rgba(250,236,220,0.92)'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=`${size*0.42}px "STKaiti","KaiTi","Noto Serif SC",serif`;

/* ============================== act label ============================== */
const actLabelEl=document.getElementById('actName');
let lastLabel='';
function updateActLabel(t){
  const i=actIndex(t);
  const label = (t>5.5 && t<CONV1) ? `<small>${ACTS[i].no}</small>${ACTS[i].name}` : '';
  if(label!==lastLabel){ lastLabel=label; if(label) actLabelEl.innerHTML=label; actLabelEl.style.opacity=label?'1':'0'; }

/* ============================== master draw ============================== */
const progressBar=document.getElementById('progressBar'), replayHint=document.getElementById('replayHint');
function draw(t){
  beginFrame();
  ctx.drawImage(paperCanvas,0,0,VW,VH);
  // 归依: every element and colour is drawn back toward the centre, swirling, into one drop of ink
  const conv=smoothstep(CONV0, CONV1, t);
  if(conv<=0){ drawWorld(t); }
  else {
    const main=ctx;
    ctx=wctx; wctx.setTransform(1,0,0,1,0,0); wctx.globalCompositeOperation='source-over'; wctx.globalAlpha=1;
    wctx.clearRect(0,0,VW,VH);
    drawWorld(t);
    // soft circular mask that tightens as everything is drawn inward
    const R=lerp(VW*0.8, VW*0.12, conv);
    const m=wctx.createRadialGradient(VW/2,VH/2,R*0.35,VW/2,VH/2,R);
    m.addColorStop(0,'rgba(0,0,0,1)'); m.addColorStop(1,'rgba(0,0,0,0)');
    wctx.globalCompositeOperation='destination-in'; wctx.fillStyle=m; wctx.fillRect(0,0,VW,VH);
    wctx.globalCompositeOperation='source-over';
    ctx=main;
    const s=lerp(1,0.015,Math.pow(conv,1.25)), rot=conv*conv*2.6;
    for(let k=3;k>=0;k--){   // trailing echoes make the gathering read as a swirl
      ctx.save();
      ctx.globalAlpha=(k===0?1:0.22/k)*(1-smoothstep(0.82,1,conv));
      ctx.translate(VW/2,VH/2); ctx.rotate(rot-k*0.12*conv); ctx.scale(s*(1+k*0.05),s*(1+k*0.05)); ctx.translate(-VW/2,-VH/2);
      ctx.drawImage(wcanvas,0,0);
      ctx.restore();
    }
  }
  drawTitle(t);
  drawFinalDot(t);
  updateActLabel(t);
  progressBar.style.width=(clamp(t/TOTAL,0,1)*100)+'%';
  replayHint.style.color = t>=TOTAL-0.5 ? 'rgba(60,48,32,0.75)' : 'rgba(60,48,32,0)';
}

/* ============================== audio: guqin-style score, storm and fireworks ============================== */
let actx=null, bus=null, master=null, windGain=null, waterGain=null, rainGain=null, nextNote=0, melodyDeg=7, phraseLeft=0;
const ksCache=new Map();
function ksBuffer(freq){
  const key=Math.round(freq*10);
  if(ksCache.has(key)) return ksCache.get(key);
  const sr=actx.sampleRate, N=Math.max(2,Math.round(sr/freq));
  const buf=actx.createBuffer(1,Math.floor(sr*3.2),sr), d=buf.getChannelData(0);
  const ring=new Float32Array(N); let prev=0;
  for(let i=0;i<N;i++){ prev=prev*0.5+(Math.random()*2-1)*0.5; ring[i]=prev; }
  let idx=0; const damp=freq<200?0.998:0.996;
  for(let i=0;i<d.length;i++){ const nx=(idx+1)%N, v=ring[idx]; d[i]=v; ring[idx]=(v+ring[nx])*0.5*damp; idx=nx; }
  ksCache.set(key,buf); return buf;
}
const LADDER=(()=>{ const semis=[0,2,4,7,9], out=[]; for(let o=0;o<3;o++) for(const s of semis) out.push(146.83*Math.pow(2,(o*12+s)/12)); return out; })();
function pluck(freq, when, vel, slide){
  const src=actx.createBufferSource(); src.buffer=ksBuffer(freq);
  const g=actx.createGain(); g.gain.value=vel;
  const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2600;
  src.connect(lp); lp.connect(g); g.connect(bus);
  if(slide){ src.playbackRate.setValueAtTime(1,when+0.25); src.playbackRate.linearRampToValueAtTime(Math.pow(2,2/12),when+0.7); }
  src.start(when); src.stop(when+3.2);
}
function noiseBuf(sec){ const sr=actx.sampleRate, b=actx.createBuffer(1,Math.floor(sr*sec),sr), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; }
function noiseLoop(){ const s=actx.createBufferSource(); s.buffer=noiseBuf(2); s.loop=true; return s; }
function thunder(when, vol){
  const s=actx.createBufferSource(); s.buffer=noiseBuf(4);
  const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=160;
  const g=actx.createGain(); g.gain.setValueAtTime(0,when);
  g.gain.linearRampToValueAtTime(vol,when+0.08);
  for(let k=1;k<6;k++) g.gain.linearRampToValueAtTime(vol*(0.4+Math.random()*0.6)*(1-k/6), when+k*0.55);
  g.gain.linearRampToValueAtTime(0,when+3.8);
  s.connect(lp); lp.connect(g); g.connect(master); s.start(when); s.stop(when+4);
}
function pop(when, vol){
  const s=actx.createBufferSource(); s.buffer=noiseBuf(0.6);
  const hp=actx.createBiquadFilter(); hp.type='bandpass'; hp.frequency.value=900; hp.Q.value=0.5;
  const g=actx.createGain(); g.gain.setValueAtTime(vol,when); g.gain.exponentialRampToValueAtTime(0.001,when+0.55);
  s.connect(hp); hp.connect(g); g.connect(bus); s.start(when); s.stop(when+0.6);
  // crackle tail
  for(let k=0;k<6;k++){ const c=actx.createBufferSource(); c.buffer=noiseBuf(0.05); const cg=actx.createGain(); cg.gain.value=vol*0.25; c.connect(cg); cg.connect(bus); c.start(when+0.3+Math.random()*0.8); }
}
function initAudio(){
  if(actx) return;
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain(); master.gain.value=0; master.connect(actx.destination);
    master.gain.setTargetAtTime(0.55, actx.currentTime, 1.2);
    const conv=actx.createConvolver(), len=Math.floor(actx.sampleRate*3.4), ir=actx.createBuffer(2,len,actx.sampleRate);
    for(let ch=0;ch<2;ch++){ const d=ir.getChannelData(ch); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8); }
    conv.buffer=ir;
    const wet=actx.createGain(); wet.gain.value=0.42; conv.connect(wet); wet.connect(master);
    bus=actx.createGain(); bus.gain.value=0.9; bus.connect(master); bus.connect(conv);
    [73.42,110].forEach((f,i)=>{
      const o=actx.createOscillator(); o.type='sine'; o.frequency.value=f;
      const g=actx.createGain(); g.gain.value=0.035;
      const lfo=actx.createOscillator(); lfo.frequency.value=0.05+i*0.03;
      const lg=actx.createGain(); lg.gain.value=0.02; lfo.connect(lg); lg.connect(g.gain);
      o.connect(g); g.connect(bus); o.start(); lfo.start();
    });
    const n1=noiseLoop(), bp=actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=480; bp.Q.value=0.6;
    windGain=actx.createGain(); windGain.gain.value=0; n1.connect(bp); bp.connect(windGain); windGain.connect(master); n1.start();
    const n2=noiseLoop(), lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=700;
    waterGain=actx.createGain(); waterGain.gain.value=0; n2.connect(lp); lp.connect(waterGain); waterGain.connect(bus); n2.start();
    const n3=noiseLoop(), hp=actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=2200;
    rainGain=actx.createGain(); rainGain.gain.value=0; n3.connect(hp); hp.connect(rainGain); rainGain.connect(master); n3.start();
    nextNote=actx.currentTime+0.4;
    setInterval(schedule,120);
  }catch(e){ actx=null; }
}
// register centre, note-length scale and density per act; the storm drops the melody entirely
const ACT_MUSIC = [{c:7,dur:1.4},{c:6,dur:1.1},{c:8,dur:0.9},{c:9,dur:0.7},null,{c:11,dur:1.2},{c:5,dur:1.6}];
function schedule(){
  if(!actx || !playing || clock>=TOTAL-4) return;
  const m=ACT_MUSIC[actIndex(clock)];
  if(!m){ nextNote=Math.max(nextNote, actx.currentTime+0.2); return; }
  while(nextNote < actx.currentTime+0.35){
    if(phraseLeft<=0){ phraseLeft=4+Math.floor(Math.random()*5); nextNote+=1.2+Math.random()*1.6*m.dur; continue; }
    const step=[-2,-1,-1,1,1,2][Math.floor(Math.random()*6)];
    melodyDeg=clamp(melodyDeg+step+(melodyDeg<m.c-3?1:0)-(melodyDeg>m.c+3?1:0),0,LADDER.length-1);
    const vel=0.3+Math.random()*0.22;
    pluck(LADDER[melodyDeg], nextNote, vel, Math.random()<0.2);
    phraseLeft--;
    if(phraseLeft===0 && melodyDeg>=5) pluck(LADDER[melodyDeg-5], nextNote+0.02, vel*0.7);
    nextNote+=[0.55,0.75,0.75,1.0,1.5][Math.floor(Math.random()*5)]*m.dur;
  }
}
const audioFired=new Set();
function updateAudio(t){
  if(!actx) return;
  const now=actx.currentTime, ai=actIndex(t), end=t>=CONV0;
  windGain.gain.setTargetAtTime(end?0:[0.01,0.05,0.03,0.015,0.11,0.02,0.015][ai], now, 1.0);
  waterGain.gain.setTargetAtTime(end?0:[0,0,0.1,0.07,0.1,0.05,0.03][ai]*smoothstep(30.5,33,t), now, 1.0);
  rainGain.gain.setTargetAtTime(stormK(t)*smoothstep(72,75,t)*(1-smoothstep(86.5,89,t))*0.09, now, 0.8);
  const fire=(key,fn)=>{ if(!audioFired.has(key)){ audioFired.add(key); fn(); } };
  if(t>DROP.tHit) fire('drop',()=>{ pluck(LADDER[0],now,0.7); pluck(LADDER[5],now+0.01,0.4); });
  BURSTS.forEach((b,i)=>{ if(t>b.t) fire('fw'+i,()=>pop(now,0.35)); });
  FLASHES.forEach((f,i)=>{ if(t>f) fire('th'+i,()=>thunder(now+0.25+Math.random()*0.5, 0.55)); });
  if(t>CRANE_T0+0.8) fire('crane',()=>{ [10,12,14].forEach((d,k)=>pluck(LADDER[d],now+k*0.18,0.45)); });
  if(t>TOTAL-5) fire('end',()=>{ pluck(LADDER[0],now+0.2,0.6); pluck(LADDER[3],now+0.22,0.45); pluck(LADDER[5],now+1.4,0.5); });
}

/* ============================== main loop / autotest ============================== */
let clock=0, lastNow=null, playing=false;
function loop(now){
  if(lastNow==null) lastNow=now;
  const dt=Math.min(0.1,(now-lastNow)/1000);
  lastNow=now;
  if(!AUTOTEST){ clock=Math.min(TOTAL,clock+dt); draw(clock); updateAudio(clock); }
  else autotestTick(now);
  requestAnimationFrame(loop);
}
// ?autotest cycles key moments; ?autotest&seek=<seconds> freezes on one
const KEY_MOMENTS=[1.6, 9, 24, 40, 60, 66, 78.3, 92, 108, 118, 123];
const seekParam=new URLSearchParams(location.search).get('seek');
const FIXED_SEEK=seekParam!==null?parseFloat(seekParam):null;
let autotestFrame=0, autotestStart=null;
function autotestTick(now){
  if(FIXED_SEEK!==null){ draw(FIXED_SEEK); return; }
  if(autotestStart===null) autotestStart=now;
  draw(KEY_MOMENTS[Math.max(Math.floor((now-autotestStart)/260), autotestFrame++)%KEY_MOMENTS.length]);
}
function start(){
  if(playing) return;
  playing=true;
  const ov=document.getElementById('startOverlay');
  ov.style.opacity='0'; setTimeout(()=>{ ov.style.display='none'; },850);
  initAudio(); lastNow=null; requestAnimationFrame(loop);
}
document.getElementById('startOverlay').addEventListener('click', start);
canvas.addEventListener('click', ()=>{
  if(clock>=TOTAL-0.3){ clock=0; audioFired.clear(); melodyDeg=7; phraseLeft=0; if(actx) nextNote=actx.currentTime+0.4; }
});
if(AUTOTEST){ document.getElementById('startOverlay').style.display='none'; playing=true; requestAnimationFrame(loop); }
else draw(0);

})();
</script>
