<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>水墨 · 七幕</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#171009;overflow:hidden;}
  canvas{display:block;position:absolute;top:0;left:0;}
  #startOverlay{
    position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;

  #startOverlay h1{font-size:44px;letter-spacing:14px;margin:0 0 10px 0;font-weight:400;text-shadow:0 0 22px rgba(233,220,180,.35);}
  #startOverlay p.sub{font-size:14px;letter-spacing:4px;color:#c8b98d;margin:4px 0 26px 0;opacity:.85;}

  #startOverlay .btn{

  }

  #hud{

  }

</style>

<body>
<canvas id="c"></canvas>
<div id="actName"></div>
<div id="hud">水墨 · 七幕　Ink-Wash · Seven Acts</div>
<div id="progressWrap"><div id="progressBar"></div></div>
<div id="replayHint">点 击 画 面　重 新 观 看</div>
<div id="startOverlay">
  <h1>水&nbsp;墨&nbsp;·&nbsp;七&nbsp;幕</h1>
  <p class="sub">A N   I N K - W A S H   J O U R N E Y   I N   S E V E N   A C T S</p>
  <div class="acts">落墨　·　群山　·　江河　·　人间　·　风暴　·　白鹤　·　归依</div>
  <div class="btn">点 击 开 始 ・ C L I C K   T O   B E G I N</div>
</div>

<script>
window.addEventListener('error', e=>{ document.title = 'ERROR: ' + e.message + ' @' + e.lineno; });
document.title = '水墨 · 七幕';

(function(){
"use strict";
const AUTOTEST = /autotest/.test(location.search);

/* ============================== canvas / viewport ============================== */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', {alpha:false});
const VW = 1600, VH = 900;
let DPR = Math.min(window.devicePixelRatio||1, 2);
let scaleFit = 1, offX = 0, offY = 0;

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  canvas.width = Math.round(w*DPR);
  canvas.height = Math.round(h*DPR);
  canvas.style.width = w+'px';
  canvas.style.height = h+'px';
  scaleFit = Math.min(w/VW, h/VH);
  offX = (w - VW*scaleFit)/2;
  offY = (h - VH*scaleFit)/2;
}
window.addEventListener('resize', resize);
resize();

function beginFrame(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#100b06';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.setTransform(DPR*scaleFit,0,0,DPR*scaleFit, offX*DPR, offY*DPR);
}

/* ============================== small math / noise utils ============================== */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function smoothstep(a,b,x){ x=clamp((x-a)/(b-a),0,1); return x*x*(3-2*x); }
function hash(n){ const s=Math.sin(n*12.9898+78.233)*43758.5453123; return s-Math.floor(s); }
function hash2(x,y){ const s=Math.sin(x*127.1+y*311.7)*43758.5453123; return s-Math.floor(s); }
function vnoise(x,y){
  const x0=Math.floor(x), y0=Math.floor(y), xf=x-x0, yf=y-y0;
  const h00=hash2(x0,y0), h10=hash2(x0+1,y0), h01=hash2(x0,y0+1), h11=hash2(x0+1,y0+1);
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  return h00*(1-u)*(1-v)+h10*u*(1-v)+h01*(1-u)*v+h11*u*v;
}
function fbm(x,y){
  let s=0, amp=0.6, freq=1, tot=0;
  for(let o=0;o<4;o++){ s+=vnoise(x*freq,y*freq)*amp; tot+=amp; amp*=0.5; freq*=2; }
  return s/tot;
}
// trapezoid ramp: fades in/out over `edge` seconds, flat 1 in the middle, clamps outside [0,dur]
function ramp(localT, dur, edge){
  edge = edge===undefined?1.2:edge;
  if(localT<0 || localT>dur) return 0;
  const a = smoothstep(0, edge, localT);
  const b = 1 - smoothstep(dur-edge, dur, localT);
  return Math.max(0, Math.min(a,b));
}

/* ============================== rice paper texture ============================== */
const paperCanvas = document.createElement('canvas');
paperCanvas.width = VW; paperCanvas.height = VH;
(function buildPaper(){
  const pctx = paperCanvas.getContext('2d');
  const grad = pctx.createLinearGradient(0,0,VW,VH);
  grad.addColorStop(0,'#f3ecd6');
  grad.addColorStop(0.5,'#eee5c9');
  grad.addColorStop(1,'#e9dfc0');
  pctx.fillStyle = grad;
  pctx.fillRect(0,0,VW,VH);
  // mottling blobs
  for(let i=0;i<50;i++){
    const x=hash(i*3.1)*VW, y=hash(i*7.7+2)*VH, r=60+hash(i*5.3)*160;
    const g = pctx.createRadialGradient(x,y,0,x,y,r);
    const tone = hash(i*9.9)>0.5 ? '210,195,150' : '180,170,140';
    g.addColorStop(0, `rgba(${tone},${0.05+hash(i)*0.05})`);
    g.addColorStop(1, 'rgba(200,190,150,0)');
    pctx.fillStyle=g;
    pctx.beginPath(); pctx.arc(x,y,r,0,Math.PI*2); pctx.fill();
  }
  // fiber lines
  pctx.globalAlpha = 1;
  for(let i=0;i<900;i++){
    const x = Math.random()*VW, y = Math.random()*VH;
    const len = 4+Math.random()*14;
    const ang = Math.random()*Math.PI;
    const dx = Math.cos(ang)*len, dy=Math.sin(ang)*len;
    pctx.strokeStyle = `rgba(150,135,95,${0.03+Math.random()*0.05})`;
    pctx.lineWidth = 0.6;
    pctx.beginPath(); pctx.moveTo(x-dx,y-dy); pctx.lineTo(x+dx,y+dy); pctx.stroke();
  }
  // fine speckle
  for(let i=0;i<2500;i++){
    const x=Math.random()*VW, y=Math.random()*VH;
    pctx.fillStyle = `rgba(120,105,75,${0.02+Math.random()*0.05})`;
    pctx.fillRect(x,y,1,1);
  }
  // vignette
  const vg = pctx.createRadialGradient(VW/2,VH/2,VH*0.3,VW/2,VH/2,VW*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(60,45,25,0.14)');
  pctx.fillStyle=vg; pctx.fillRect(0,0,VW,VH);
})();

/* ============================== brush stroke helper ============================== */
function catmullRomPoints(pts, samples){
  if(pts.length<2) return pts.slice();
  if(pts.length===2){
    const res=[]; for(let s=0;s<=samples;s++){ const t=s/samples; res.push({x:lerp(pts[0].x,pts[1].x,t), y:lerp(pts[0].y,pts[1].y,t)}); } return res;
  }
  const res=[];
  const p=[pts[0], ...pts, pts[pts.length-1]];
  for(let i=0;i<pts.length-1;i++){
    const p0=p[i], p1=p[i+1], p2=p[i+2], p3=p[i+3];
    for(let s=0;s<samples;s++){
      const t=s/samples, t2=t*t, t3=t2*t;
      const x=0.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3);
      const y=0.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3);
      res.push({x,y});
    }
  }
  res.push(pts[pts.length-1]);
  return res;
}
function brushStroke(ctx, rawPts, opts={}){
  const {width=8, color='rgba(20,20,22,0.85)', taper=true, jitter=0, passes=1, seed=1, minTaper=0.06} = opts;
  const pts = catmullRomPoints(rawPts, 8);
  for(let pass=0; pass<passes; pass++){
    const left=[], right=[];
    for(let i=0;i<pts.length;i++){
      const p=pts[i];
      const prev=pts[Math.max(0,i-1)], next=pts[Math.min(pts.length-1,i+1)];
      let nx=-(next.y-prev.y), ny=(next.x-prev.x);
      const len=Math.hypot(nx,ny)||1; nx/=len; ny/=len;
      const u=i/(pts.length-1);
      let w = width;
      if(taper) w *= Math.sin(Math.PI*clamp(u,minTaper,1-minTaper))*0.9+0.15;
      const jig = jitter ? (hash(i*13.7+seed*7.3+pass*3.1)-0.5)*jitter : 0;
      const hw=(w+jig)/2;
      left.push({x:p.x+nx*hw, y:p.y+ny*hw});
      right.push({x:p.x-nx*hw, y:p.y-ny*hw});
    }
    ctx.beginPath();
    ctx.moveTo(left[0].x,left[0].y);
    for(const p of left) ctx.lineTo(p.x,p.y);
    for(let i=right.length-1;i>=0;i--) ctx.lineTo(right[i].x,right[i].y);
    ctx.closePath();
    ctx.fillStyle=color;
    ctx.fill();
  }
}

/* ============================== ink diffusion grid (reaction-diffusion style) ============================== */
const GW=200, GH=113;
class InkGrid{
  constructor(gw,gh){
    this.gw=gw; this.gh=gh;
    this.cur=new Float32Array(gw*gh);
    this.nxt=new Float32Array(gw*gh);
    this.dry=new Float32Array(gw*gh);
    this.bias=new Float32Array(gw*gh);
    for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){
      const n = fbm(x*0.06, y*0.09);
      this.bias[y*gw+x] = 0.55+n*0.9;
    }
    this.small = document.createElement('canvas');
    this.small.width=gw; this.small.height=gh;
    this.sctx = this.small.getContext('2d');
    this.imgData = this.sctx.createImageData(gw,gh);
    const d = this.imgData.data;
    for(let i=0;i<gw*gh;i++) d[i*4]=16, d[i*4+1]=15, d[i*4+2]=19;
  }
  reset(){ this.cur.fill(0); this.nxt.fill(0); this.dry.fill(0); }
  eraseRegion(nx,ny,radX,radY,strength){
    const gw=this.gw, gh=this.gh;
    const cx=nx*gw, cy=ny*gh;
    const x0=Math.max(0,Math.floor(cx-radX*1.7)), x1=Math.min(gw-1,Math.ceil(cx+radX*1.7));
    const y0=Math.max(0,Math.floor(cy-radY*1.7)), y1=Math.min(gh-1,Math.ceil(cy+radY*1.7));
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
      const dx=x-cx, dy=y-cy;
      const d2=(dx*dx)/(radX*radX)+(dy*dy)/(radY*radY);
      const g=Math.exp(-d2/0.62);
      const idx=y*gw+x;
      const f = Math.max(0, 1-strength*g);
      this.cur[idx]*=f; this.dry[idx]*=f;
    }
  }
  addDrop(nx,ny,amt,radX,radY){
    radY = radY===undefined ? radX : radY;
    const gw=this.gw, gh=this.gh;
    const cx=nx*gw, cy=ny*gh;
    const rmax = Math.max(radX,radY);
    const x0=Math.max(0,Math.floor(cx-radX*1.7)), x1=Math.min(gw-1,Math.ceil(cx+radX*1.7));
    const y0=Math.max(0,Math.floor(cy-radY*1.7)), y1=Math.min(gh-1,Math.ceil(cy+radY*1.7));
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
      const dx=x-cx, dy=y-cy;
      const d2 = (dx*dx)/(radX*radX) + (dy*dy)/(radY*radY);
      const g = Math.exp(-d2/0.62);
      if(g>0.003){
        const idx=y*gw+x;
        this.cur[idx] = Math.min(1.5, this.cur[idx]+amt*g);
      }
    }
  }
  step(diffRate, decay, drySpeed, substeps){
    const gw=this.gw, gh=this.gh;
    for(let s=0;s<substeps;s++){
      const cur=this.cur, nxt=this.nxt, bias=this.bias;
      for(let y=0;y<gh;y++){
        const yUp = y>0?y-1:y, yDn = y<gh-1?y+1:y;
        const rowUp = yUp*gw, rowDn = yDn*gw, row=y*gw;
        for(let x=0;x<gw;x++){
          const i = row+x;
          const xL = x>0?x-1:x, xR = x<gw-1?x+1:x;
          const lap = cur[row+xL]+cur[row+xR]+cur[rowUp+x]+cur[rowDn+x]-4*cur[i];
          let v = cur[i] + diffRate*bias[i]*lap - decay*cur[i];
          if(v<0) v=0; else if(v>1.5) v=1.5;
          nxt[i]=v;
        }
      }
      this.cur.set(nxt);
    }
    const cur=this.cur, dry=this.dry;
    for(let i=0;i<gw*gh;i++){
      const target = cur[i]*drySpeed;
      if(target>dry[i]) dry[i]+= (target-dry[i])*0.16;
      else dry[i]*=0.9993;
    }
  }
  renderTo(ctx, vx,vy,vw,vh, visibility){
    if(visibility<=0.002) return;
    const gw=this.gw, gh=this.gh, cur=this.cur, dry=this.dry, data=this.imgData.data;
    for(let i=0;i<gw*gh;i++){
      const val = Math.min(1, cur[i]*0.62 + dry[i]*0.62);
      data[i*4+3] = Math.min(255, val*255*visibility);
    }
    this.sctx.putImageData(this.imgData,0,0);
    ctx.save();
    // plain alpha compositing (not 'multiply') -- multiply-blending a full-frame layer
    // over very dark backgrounds triggers a visible dithering/checkerboard artifact under
    // this software (SwiftShader) canvas rasterizer; source-over avoids it and looks the
    // same since the ink color itself is near-black.
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(this.small, 0,0,gw,gh, vx,vy,vw,vh);
    ctx.restore();
  }
}
const inkGrid = new InkGrid(GW,GH);

/* ridge silhouettes are defined here (used both by ink-wash events below and by the
   vector mountain backdrop drawn later) so the diffused ink mass tracks the peaks. */
function ridgeShape(baseY, amp, seedOffset, points){
  points = points||26;
  const pts=[];
  for(let i=0;i<=points;i++){
    const x = i/points*VW;
    const n = fbm(i*0.45+seedOffset, seedOffset*3.7);
    const y = baseY - amp*(0.35+0.65*n);
    pts.push({x,y});
  }
  return pts;
}
const farRidge = ridgeShape(430, 130, 1.1, 22);
const midRidge = ridgeShape(560, 170, 4.4, 24);
const nearRidge = ridgeShape(700, 210, 8.8, 26);

/* generate a run of soft elliptical ink-wash events tracing a ridge curve, spaced closely
   enough (with generous overlap) that they read as one continuous diffused wash band
   rather than isolated blobs, appearing left-to-right over [startT,endT]. */
function ridgeWashEvents(ridgePts, startT, endT, amt, radX, radY, yOffset){
  const events=[];
  for(let i=1;i<ridgePts.length;i+=2){
    const p = ridgePts[i];
    const tt = lerp(startT, endT, i/(ridgePts.length-1));
    events.push({t:tt, gx:p.x/VW, gy:(p.y+(yOffset||30))/VH, amt, radX, radY});
  }
  return events;
}

/* scripted ink events: {t, gx, gy, amt, radX, radY} gx/gy normalized 0..1, rad in grid cells */
const INK_EVENTS = [
  {t:2.0, gx:0.50, gy:0.16, amt:1.35, radX:4.2},
  {t:2.35, gx:0.505, gy:0.185, amt:0.5, radX:7},
  {t:2.7, gx:0.49, gy:0.20, amt:0.3, radX:10},
  // the fallen drop's mass sinks away just before the mountains coalesce from it
  {t:13.2, gx:0.495, gy:0.195, erase:true, radX:15, radY:15, strength:1.0},
  // Act 2 mountains: soft ink-wash bands tracing each ridge (coalescing left-to-right)
  ...ridgeWashEvents(farRidge, 14.5, 19.5, 0.16, 11, 5, 26),
  ...ridgeWashEvents(midRidge, 18.0, 23.0, 0.20, 12, 6, 28),
  ...ridgeWashEvents(nearRidge, 21.5, 27.0, 0.26, 13, 7, 30),
  // Act5 storm: wide low ellipses rolling in from the left across the upper sky band
  {t:70.0, gx:0.00, gy:0.13, amt:0.55, radX:20, radY:8},
  {t:71.2, gx:0.12, gy:0.10, amt:0.6, radX:22, radY:9},
  {t:72.4, gx:0.24, gy:0.15, amt:0.62, radX:22, radY:9},
  {t:73.6, gx:0.36, gy:0.10, amt:0.65, radX:23, radY:9},
  {t:74.8, gx:0.48, gy:0.14, amt:0.65, radX:23, radY:9},
  {t:76.0, gx:0.60, gy:0.09, amt:0.65, radX:23, radY:9},
  {t:77.2, gx:0.72, gy:0.13, amt:0.65, radX:23, radY:9},
  {t:78.4, gx:0.84, gy:0.09, amt:0.6, radX:22, radY:9},
  {t:79.6, gx:0.95, gy:0.13, amt:0.55, radX:20, radY:8},
  {t:81.0, gx:0.30, gy:0.22, amt:0.4, radX:26, radY:10},
  {t:82.5, gx:0.55, gy:0.24, amt:0.4, radX:26, radY:10},
  {t:84.0, gx:0.75, gy:0.20, amt:0.35, radX:24, radY:10},
];
INK_EVENTS.sort((a,b)=>a.t-b.t);

let inkEventPtr = 0, inkSimTime = 0;
const INK_DT = 1/24;
// NOTE: explicit diffusion is only numerically stable while diffRate*maxBias stays below ~0.25
// (bias field ranges ~0.55..1.45); exceeding it produces a classic odd-even "checkerboard"
// numerical instability that compounds over many steps. Keep all rates comfortably under that.
function diffRateFor(t){ if(t>=69 && t<90) return 0.165; return 0.16; }
function decayFor(t){ if(t>=116) return 0.05; if(t>=90 && t<103) return 0.010; return 0.0026; }
function ensureInkAt(target){
  if(target < inkSimTime - 1e-6){ inkGrid.reset(); inkSimTime=0; inkEventPtr=0; }
  let guard=0;
  while(inkSimTime < target - 1e-6 && guard<100000){
    guard++;
    const dt = Math.min(INK_DT, target-inkSimTime);
    while(inkEventPtr<INK_EVENTS.length && INK_EVENTS[inkEventPtr].t <= inkSimTime+dt+1e-6){
      const e = INK_EVENTS[inkEventPtr++];
      if(e.erase) inkGrid.eraseRegion(e.gx,e.gy,e.radX,e.radY,e.strength);
      else inkGrid.addDrop(e.gx,e.gy,e.amt,e.radX,e.radY);
    }
    inkGrid.step(diffRateFor(inkSimTime), decayFor(inkSimTime), 0.55, 1);
    inkSimTime += dt;
  }
}

/* ============================== timeline ============================== */
const ACTS = [
  {name:'落墨', start:0,   end:14},
  {name:'群山', start:14,  end:30},
  {name:'江河', start:30,  end:48},
  {name:'人间', start:48,  end:70},
  {name:'风暴', start:70,  end:88},
  {name:'白鹤', start:88,  end:102},
  {name:'归依', start:102, end:124},
];
const TOTAL = 124;
const WORLD_FADE_START=113, WORLD_FADE_END=123.5;
function worldFade(t){ return 1 - smoothstep(WORLD_FADE_START, WORLD_FADE_END, t); }

function fillSilhouette(pts, bottomY, color){
  ctx.beginPath();
  ctx.moveTo(-10, bottomY);
  for(const p of pts) ctx.lineTo(p.x,p.y);
  ctx.lineTo(VW+10, bottomY);
  ctx.closePath();
  ctx.fillStyle=color;
  ctx.fill();
}

/* ---- persistent backdrop: mountains (farRidge/midRidge/nearRidge defined above, shared with ink events) ---- */
function drawMountains(t){
  const a = smoothstep(13.5, 27, t) * worldFade(t);
  if(a<=0.002) return;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.globalCompositeOperation='multiply';
  fillSilhouette(farRidge, 470, 'rgba(150,150,158,0.42)');
  fillSilhouette(midRidge, 610, 'rgba(95,95,102,0.55)');
  fillSilhouette(nearRidge, 760, 'rgba(35,33,38,0.72)');
  ctx.restore();
  ctx.save();
  ctx.globalAlpha = a;
  brushStroke(ctx, farRidge, {width:3, color:'rgba(120,120,128,0.5)', jitter:1.5, seed:2});
  brushStroke(ctx, midRidge, {width:4, color:'rgba(60,58,64,0.6)', jitter:2, seed:5});
  brushStroke(ctx, nearRidge, {width:5.5, color:'rgba(18,16,20,0.75)', jitter:2.5, seed:9});
  ctx.restore();
}

/* ---- persistent backdrop: river ---- */
function drawRiver(t){
  const a = smoothstep(30, 40, t) * worldFade(t) * (1-smoothstep(115,124,t)*0);
  if(a<=0.002) return;
  ctx.save();
  ctx.globalAlpha=a;
  const topPts=[], botPts=[];
  const baseY = 800;
  for(let i=0;i<=20;i++){
    const x=i/20*VW;
    topPts.push({x, y: baseY-40+Math.sin(x*0.006+t*0.3)*10});
    botPts.push({x, y: VH+10});
  }
  ctx.globalCompositeOperation='multiply';
  ctx.beginPath();
  ctx.moveTo(topPts[0].x, topPts[0].y);
  for(const p of topPts) ctx.lineTo(p.x,p.y);
  ctx.lineTo(VW+10, VH+10); ctx.lineTo(-10, VH+10);
  ctx.closePath();
  const rg = ctx.createLinearGradient(0,baseY-40,0,VH);
  rg.addColorStop(0,'rgba(90,95,100,0.35)');
  rg.addColorStop(1,'rgba(60,65,72,0.5)');
  ctx.fillStyle = rg;
  ctx.fill();
  ctx.restore();
  // flow highlight streaks
  ctx.save();
  ctx.globalAlpha = a*0.5;
  for(let i=0;i<16;i++){
    const yy = baseY+10+ (i%8)*22;
    const off = (t*40 + i*97) % (VW+200) - 100;
    ctx.strokeStyle = 'rgba(255,252,240,0.18)';
    ctx.lineWidth=1.2;
    ctx.beginPath();
    ctx.moveTo(off, yy+Math.sin(i)*4);
    ctx.lineTo(off+60, yy+Math.sin(i)*4);
    ctx.stroke();
  }
  ctx.restore();
}

/* ---- sunrise (act3 only, fades before storm) ---- */
function drawSun(t){
  const a = ramp(t-32, 36, 4) ; // visible ~32..68
  if(a<=0.002) return;
  const localT = clamp(t-32,0,36);
  const y = lerp(560, 330, smoothstep(0,14,localT));
  const x = 1230;
  const r = 46+smoothstep(0,10,localT)*10;
  ctx.save();
  ctx.globalAlpha = a*worldFade(t);
  const g = ctx.createRadialGradient(x,y,0,x,y,r*2.2);
  g.addColorStop(0,'rgba(198,60,40,0.9)');
  g.addColorStop(0.4,'rgba(190,70,40,0.5)');
  g.addColorStop(1,'rgba(190,70,40,0)');
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(x,y,r*2.2,0,Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation='multiply';
  ctx.fillStyle='rgba(196,58,42,0.75)';
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

/* ---- birds (act3, linger a bit) ---- */
function drawBirds(t){
  const a = ramp(t-31, 34, 3);
  if(a<=0.002) return;
  ctx.save();
  ctx.globalAlpha = a*worldFade(t);
  ctx.strokeStyle='rgba(25,22,20,0.8)';
  ctx.lineWidth=3.2;
  ctx.lineCap='round';
  for(let i=0;i<5;i++){
    const speed=18+hash(i*3)*10;
    const phase=hash(i*7)*1000;
    const x = ((t*speed+phase) % (VW+300))-150;
    const y = 190+hash(i*5)*130+Math.sin(t*1.5+i)*8;
    const flap = Math.sin(t*9+i*2)*0.35+0.5;
    const s=16+hash(i*11)*9;
    ctx.beginPath();
    ctx.moveTo(x-s, y-s*flap);
    ctx.quadraticCurveTo(x, y+s*0.3, x+s, y-s*flap);
    ctx.stroke();
  }
  ctx.restore();
}

/* ---- village + boats + fireworks (act4) ---- */
function drawEave(cx, baseY, w, h, color, alpha){
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(cx-w/2, baseY);
  ctx.lineTo(cx-w/2, baseY-h*0.5);
  ctx.quadraticCurveTo(cx-w*0.36, baseY-h*1.15, cx-w*0.5-6, baseY-h*1.05);
  ctx.quadraticCurveTo(cx, baseY-h*1.5, cx+w*0.5+6, baseY-h*1.05);
  ctx.quadraticCurveTo(cx+w*0.36, baseY-h*1.15, cx+w/2, baseY-h*0.5);
  ctx.lineTo(cx+w/2, baseY);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function drawVillage(t){
  const a = ramp(t-49, 21, 3);
  if(a<=0.002) return;
  const localT = clamp(t-49,0,21);
  ctx.save();
  ctx.globalAlpha = a;
  // dusk sky wash
  const g = ctx.createLinearGradient(0,0,0,500);
  const skyMix = smoothstep(0,16,localT);
  g.addColorStop(0, `rgba(${lerp(210,40,skyMix)},${lerp(150,30,skyMix)},${lerp(120,55,skyMix)},0.35)`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,VW,520);
  // buildings on both banks
  const posX = [220,340,460,1120,1260,1400];
  for(let i=0;i<posX.length;i++){
    const bx = posX[i];
    const scale = 0.7+hash(i*3.3)*0.5;
    const by = 792 + (i<3? -6:6);
    drawEave(bx, by, 90*scale, 46*scale, 'rgba(20,18,20,0.78)', 1);
    // tiers
    for(let k=0;k<2;k++){
      drawEave(bx, by-46*scale*0.62*(k+1), 70*scale*(1-k*0.18), 30*scale, 'rgba(20,18,20,0.7)', 1);
    }
    // window light
    ctx.globalCompositeOperation='lighter';
    ctx.fillStyle = `rgba(230,170,80,${0.22+0.1*Math.sin(t*3+i)})`;
    ctx.fillRect(bx-6, by-16, 10, 8);
    ctx.globalCompositeOperation='source-over';
  }
  // boats (pale hull with dark outline so they read clearly against the dark river)
  for(let i=0;i<3;i++){
    const bx = 500+i*230 + Math.sin(t*0.4+i)*20;
    const by = 812+Math.sin(t*1.1+i*2)*3;
    ctx.beginPath();
    ctx.moveTo(bx-34,by);
    ctx.quadraticCurveTo(bx,by+13,bx+34,by);
    ctx.quadraticCurveTo(bx,by+5,bx-34,by);
    ctx.fillStyle='rgba(210,198,165,0.92)';
    ctx.fill();
    ctx.lineWidth=1.6;
    ctx.strokeStyle='rgba(20,18,16,0.85)';
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx,by-2); ctx.lineTo(bx,by-28); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx,by-24); ctx.lineTo(bx+16,by-18); ctx.lineTo(bx,by-13); ctx.closePath();
    ctx.fillStyle='rgba(210,198,165,0.8)'; ctx.fill(); ctx.stroke();
  }
  ctx.restore();

  // fireworks
  const bursts = [ {t:10, x:420, y:260}, {t:13.5, x:1180, y:220}, {t:16.5, x:760, y:200}, {t:19, x:960,y:250} ];
  for(const b of bursts){
    const lt = localT-b.t;
    if(lt<0 || lt>2.6) continue;
    const prog = lt/2.6;
    const fade = 1-prog;
    ctx.save();
    ctx.globalAlpha = a*fade*0.9;
    ctx.globalCompositeOperation='lighter';
    const N=26;
    for(let i=0;i<N;i++){
      const ang = i/N*Math.PI*2 + hash(i+b.x)*0.2;
      const speed = 60+hash(i*2+b.y)*70;
      const dist = speed*prog;
      const px = b.x+Math.cos(ang)*dist;
      const py = b.y+Math.sin(ang)*dist + prog*prog*40;
      const hue = hash(i+b.t)>0.5 ? '214,110,80' : '230,190,110';
      ctx.fillStyle = `rgba(${hue},${fade})`;
      ctx.beginPath(); ctx.arc(px,py,2.4,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

/* ---- storm: sky darken, clouds, lightning, rain (act5, tapering into act6) ---- */
function drawStorm(t){
  const a = ramp(t-69, 20, 2.5);
  if(a<=0.002) return;
  const localT = clamp(t-69,0,20);
  ctx.save();
  ctx.globalAlpha=a;
  ctx.fillStyle = `rgba(15,15,22,${0.15+0.35*smoothstep(0,8,localT)})`;
  ctx.fillRect(0,0,VW,VH);
  ctx.restore();

  // turbulent cloud blobs -- built from flat-alpha concentric circles rather than
  // ctx.createRadialGradient: large radial gradients stacked over a near-black sky
  // trigger a visible dithering/checkerboard artifact under this software (SwiftShader)
  // canvas rasterizer, while plain flat fills do not.
  ctx.save();
  ctx.globalAlpha = a;
  for(let i=0;i<12;i++){
    const speed=26+hash(i*4)*24;
    const x = ((localT*speed + hash(i*9)*VW) % (VW+500))-250;
    const y = 50+hash(i*3)*230+Math.sin(localT*0.4+i)*12;
    const r = 55+hash(i*7)*55;
    const cx0 = x + (hash(i*13)-0.5)*r*0.3;
    const cy0 = y + (hash(i*17)-0.5)*r*0.3;
    // several soft, off-center, jittered-radius blobs per cluster -- avoids a "target/bullseye"
    // look while still approximating a soft falloff without ctx.createRadialGradient
    for(let k=6;k>=1;k--){
      const frac = k/6;
      const jx = cx0 + (hash(i*23+k*5)-0.5)*r*0.35;
      const jy = cy0 + (hash(i*29+k*7)-0.5)*r*0.35;
      ctx.fillStyle = `rgba(12,11,16,${0.05+0.045*(6-k)})`;
      ctx.beginPath(); ctx.arc(jx,jy,r*frac,0,Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();

  // lightning flashes
  const flashes=[3.5,8.2,12.6,16.4];
  for(const ft of flashes){
    const dl = localT-ft;
    if(dl<0 || dl>0.28) continue;
    const flashA = (1-dl/0.28)*a;
    ctx.save();
    ctx.globalAlpha = flashA*0.55;
    ctx.fillStyle='rgba(220,225,240,1)';
    ctx.fillRect(0,0,VW,VH);
    ctx.restore();
    if(dl<0.15){
      const seed=ft*97;
      let x=300+hash(seed)*1000, y=0;
      ctx.save();
      ctx.globalAlpha=flashA;
      ctx.strokeStyle='rgba(255,255,240,0.95)';
      ctx.lineWidth=2.4;
      ctx.beginPath(); ctx.moveTo(x,y);
      for(let s=0;s<7;s++){
        x += (hash(seed+s)-0.5)*80;
        y += 60+hash(seed+s*2)*40;
        ctx.lineTo(x,y);
      }
      ctx.stroke();
      ctx.restore();
    }
  }

  // rain -- batched into a single path/stroke call (cheap to rasterize)
  ctx.save();
  ctx.globalAlpha = a*0.55*smoothstep(0,4,localT)*(1-smoothstep(16,20,localT));
  ctx.strokeStyle='rgba(210,215,225,0.5)';
  ctx.lineWidth=1;
  ctx.beginPath();
  for(let i=0;i<90;i++){
    const speed=700+hash(i)*260;
    const x=((hash(i*3.3)*VW + localT*80)%(VW+80))-40;
    const y=((hash(i*7.1)*VH + localT*speed)%(VH+80))-40;
    ctx.moveTo(x,y); ctx.lineTo(x-8,y+22);
  }
  ctx.stroke();
  ctx.restore();
}

/* ---- crane (act6) ---- */
function drawCrane(t){
  const a = ramp(t-87, 16, 2.5);
  if(a<=0.002) return;
  const localT = clamp(t-87,0,16);
  const rise = smoothstep(0,11,localT);
  const cx = lerp(800, 980, smoothstep(0,16,localT)) + Math.sin(localT*0.6)*30;
  const cy = lerp(760, 250, rise);
  const scalePop = 1+ (localT<2? (1-localT/2)*0.25:0);
  const flap = Math.sin(localT*5.5)*0.5;

  // calm sky brightening behind crane during ascent
  ctx.save();
  ctx.globalAlpha = a*smoothstep(2,10,localT)*0.5;
  const g = ctx.createLinearGradient(0,0,0,600);
  g.addColorStop(0,'rgba(255,244,225,0.35)');
  g.addColorStop(1,'rgba(255,244,225,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,600);
  ctx.restore();

  ctx.save();
  ctx.globalAlpha=a;
  ctx.translate(cx,cy);
  ctx.scale(scalePop, scalePop);
  ctx.rotate(-0.15+flap*0.05);

  // wings
  brushStroke(ctx, [{x:-6,y:0},{x:-70,y:-30-flap*40},{x:-130,y:6-flap*30}], {width:22,color:'rgba(250,250,246,0.94)',taper:true,jitter:2,seed:1});
  brushStroke(ctx, [{x:6,y:0},{x:70,y:-30-flap*40},{x:130,y:6-flap*30}], {width:22,color:'rgba(250,250,246,0.94)',taper:true,jitter:2,seed:2});
  ctx.strokeStyle='rgba(30,28,26,0.5)'; ctx.lineWidth=1.4;
  // body
  ctx.fillStyle='rgba(252,251,246,0.97)';
  ctx.beginPath(); ctx.ellipse(0,4,26,14,0.15,0,Math.PI*2); ctx.fill();
  ctx.stroke();
  // neck + head
  brushStroke(ctx, [{x:14,y:-4},{x:34,y:-40},{x:24,y:-64},{x:40,y:-72}], {width:7,color:'rgba(252,251,246,0.97)',taper:true,seed:3});
  ctx.fillStyle='rgba(20,18,18,0.9)';
  ctx.beginPath(); ctx.arc(40,-72,3.4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(43,-73); ctx.lineTo(56,-70); ctx.lineTo(43,-68); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(190,40,35,0.85)';
  ctx.beginPath(); ctx.arc(40,-78,2.6,0,Math.PI*2); ctx.fill();
  // legs trailing
  ctx.strokeStyle='rgba(40,36,34,0.7)'; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(-4,16); ctx.lineTo(-10,34); ctx.moveTo(4,16); ctx.lineTo(10,34); ctx.stroke();
  ctx.restore();
}

/* ---- act7: sun + moon + galaxy, then convergence ---- */
const stars = Array.from({length:150}, (_,i)=>({
  x: hash(i*3.1)*VW, y: hash(i*5.7)*560, r: 0.6+hash(i*7.3)*1.6, ph: hash(i*9.1)*10
}));
function drawHeavens(t){
  const a = ramp(t-101, 23, 3);
  if(a<=0.002) return;
  const localT = clamp(t-101,0,23);
  const shrink = smoothstep(115, 123, t);
  const cx=VW/2, cy=VH/2;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(cx,cy);
  ctx.scale(lerp(1,0.04,shrink), lerp(1,0.04,shrink));
  ctx.translate(-cx,-cy);

  // night sky wash
  ctx.save();
  ctx.globalAlpha *= smoothstep(0,6,localT);
  ctx.globalCompositeOperation='multiply';
  const ng = ctx.createLinearGradient(0,0,0,600);
  ng.addColorStop(0,'rgba(30,30,55,0.28)');
  ng.addColorStop(1,'rgba(30,30,55,0.02)');
  ctx.fillStyle=ng; ctx.fillRect(0,0,VW,600);
  ctx.restore();

  // stars + galaxy spiral
  ctx.save();
  ctx.globalAlpha *= smoothstep(2,10,localT);
  ctx.globalCompositeOperation='lighter';
  for(const s of stars){
    const tw = 0.4+0.6*Math.abs(Math.sin(t*1.3+s.ph));
    ctx.fillStyle = `rgba(255,255,245,${0.5*tw})`;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  }
  const gcx=VW*0.5, gcy=230, rot=t*0.06;
  for(let i=0;i<160;i++){
    const ang = i*0.24+rot;
    const r = i*1.15;
    const x = gcx+Math.cos(ang)*r;
    const y = gcy+Math.sin(ang)*r*0.42;
    ctx.fillStyle=`rgba(220,225,255,${0.35*(1-i/160)})`;
    ctx.beginPath(); ctx.arc(x,y,1.4,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();

  // sun & moon together
  ctx.save();
  ctx.globalAlpha *= smoothstep(0,7,localT);
  const sx=420, mx=1180, sy=300, my=300, r=54;
  let g1=ctx.createRadialGradient(sx,sy,0,sx,sy,r*1.8);
  g1.addColorStop(0,'rgba(205,60,45,0.85)'); g1.addColorStop(1,'rgba(205,60,45,0)');
  ctx.fillStyle=g1; ctx.beginPath(); ctx.arc(sx,sy,r*1.8,0,Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation='multiply';
  ctx.fillStyle='rgba(200,58,45,0.75)';
  ctx.beginPath(); ctx.arc(sx,sy,r*0.7,0,Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation='source-over';
  let g2=ctx.createRadialGradient(mx,my,0,mx,my,r*1.6);
  g2.addColorStop(0,'rgba(230,230,210,0.75)'); g2.addColorStop(1,'rgba(230,230,210,0)');
  ctx.fillStyle=g2; ctx.beginPath(); ctx.arc(mx,my,r*1.6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(225,222,200,0.85)';
  ctx.beginPath(); ctx.arc(mx,my,r*0.62,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(190,186,165,0.5)';
  ctx.beginPath(); ctx.arc(mx-14,my-8,7,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx+10,my+12,5,0,Math.PI*2); ctx.fill();
  ctx.restore();

  ctx.restore();
}

/* ---- final ink dot + seal ---- */

const actLabelEl = document.getElementById('actName');
let lastLabel='';
function updateActLabel(t){
  let cur=null;
  for(const act of ACTS){ if(t>=act.start && t<act.end){ cur=act; break; } }
  const label = cur? cur.name : '';
  if(label!==lastLabel){
    lastLabel=label;
    actLabelEl.textContent = label;
    actLabelEl.style.opacity = label? '0.85':'0';
  }
}

/* ============================== master draw ============================== */
function draw(t){
  beginFrame();
  ctx.drawImage(paperCanvas,0,0,VW,VH);
  ensureInkAt(t);
  inkGrid.renderTo(ctx, 0,0,VW,VH, worldFade(t));
  drawMountains(t);
  drawRiver(t);
  drawSun(t);
  drawBirds(t);
  drawVillage(t);
  drawStorm(t);
  drawCrane(t);
  drawHeavens(t);
  drawFinalDot(t);
  drawTitleIntro(t);
  updateActLabel(t);
  const bar = document.getElementById('progressBar');
  bar.style.width = (clamp(t/TOTAL,0,1)*100)+'%';
  const hint = document.getElementById('replayHint');
  hint.style.color = t>=TOTAL-0.5 ? 'rgba(235,224,196,0.75)' : 'rgba(235,224,196,0)';
}

/* ============================== audio (optional, best-effort) ============================== */
let actx=null, master=null;
function initAudio(){
  try{
    actx = new (window.AudioContext||window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value=0.3; master.connect(actx.destination);
    [110,164.8].forEach((f,i)=>{
      const o=actx.createOscillator(); o.type='sine'; o.frequency.value=f;
      const g=actx.createGain(); g.gain.value=0.045;
      o.connect(g); g.connect(master); o.start();
      const lfo=actx.createOscillator(); lfo.frequency.value=0.04+i*0.02;
      const lg=actx.createGain(); lg.gain.value=0.02;
      lfo.connect(lg); lg.connect(g.gain); lfo.start();
    });
  }catch(e){}
}
function noiseBurst(dur,freq,vol){
  if(!actx) return;
  try{
    const buf=actx.createBuffer(1, Math.max(1,actx.sampleRate*dur), actx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const src=actx.createBufferSource(); src.buffer=buf;
    const filt=actx.createBiquadFilter(); filt.type='bandpass'; filt.frequency.value=freq; filt.Q.value=0.6;
    const g=actx.createGain(); g.gain.value=0;
    src.connect(filt); filt.connect(g); g.connect(master);
    const now=actx.currentTime;
    g.gain.linearRampToValueAtTime(vol, now+0.03);
    g.gain.linearRampToValueAtTime(0, now+dur);
    src.start(); src.stop(now+dur+0.05);
  }catch(e){}
}
function bell(freq,dur,vol){
  if(!actx) return;
  try{
    const o=actx.createOscillator(); o.type='sine'; o.frequency.value=freq;
    const g=actx.createGain(); g.gain.value=0;
    o.connect(g); g.connect(master);
    const now=actx.currentTime;
    g.gain.linearRampToValueAtTime(vol, now+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, now+dur);
    o.start(now); o.stop(now+dur+0.1);
  }catch(e){}
}
const audioFired = new Set();
function fireAudioEvents(t){
  if(!actx) return;
  const fire=(key,fn)=>{ if(!audioFired.has(key)){ audioFired.add(key); fn(); } };
  if(t>1.9) fire('drop', ()=>noiseBurst(0.5,900,0.18));
  [ [72.4,'l1'],[77.1,'l2'],[81.5,'l3'],[85.3,'l4'] ].forEach(([tt,key])=>{
    if(t>tt) fire(key, ()=>noiseBurst(0.9,220,0.22));
  });
  if(t>89.2) fire('crane', ()=>bell(660,2.6,0.18));
  if(t>121.5) fire('finalbell', ()=>bell(330,3.2,0.15));
}

/* ============================== main loop / autotest ============================== */
let clock=0, lastNow=null, playing=false;

function loop(now){
  if(lastNow==null) lastNow=now;
  const dt=(now-lastNow)/1000;
  lastNow=now;
  if(!AUTOTEST){
    clock = Math.min(TOTAL, clock+dt);
    draw(clock);
    fireAudioEvents(clock);
  } else {
    autotestTick(now);
  }
  requestAnimationFrame(loop);
}

const KEY_MOMENTS = [1.5, 8, 16, 24, 34, 44, 55, 63, 74, 80, 92, 98, 108, 118, 123];
const seekParam = new URLSearchParams(location.search).get('seek');
const FIXED_SEEK = seekParam!==null ? parseFloat(seekParam) : null;
let autotestFrame = 0, autotestStart = null;
function autotestTick(now){
  if(FIXED_SEEK!==null){ draw(FIXED_SEEK); return; }
  if(autotestStart===null) autotestStart = now;
  // combine a wall/virtual-clock index with a frame-count index (whichever is further
  // along) so progression through key moments is robust regardless of whether headless
  // virtual-time rendering advances `now` quickly with few rAF callbacks, or ticks rAF
  // many times per second -- either way, a longer --virtual-time-budget wait lands
  // further along the list.
  const timeIdx = Math.floor((now-autotestStart)/260);
  const frameIdx = autotestFrame;
  autotestFrame++;
  const idx = Math.max(timeIdx, frameIdx) % KEY_MOMENTS.length;
  draw(KEY_MOMENTS[idx]);
}

function start(){
  if(playing) return;
  playing=true;
  document.getElementById('startOverlay').style.opacity='0';
  setTimeout(()=>{ document.getElementById('startOverlay').style.display='none'; }, 850);
  initAudio();
  lastNow=null;
  requestAnimationFrame(loop);
}

document.getElementById('startOverlay').addEventListener('click', start);
canvas.addEventListener('click', ()=>{
  if(clock>=TOTAL-0.3 || AUTOTEST){ clock=0; audioFired.clear(); }
});

if(AUTOTEST){
  document.getElementById('startOverlay').style.display='none';
  playing=true;
  requestAnimationFrame(loop);
} else {
  draw(0); // paint first frame behind overlay
}
})();
</script>
